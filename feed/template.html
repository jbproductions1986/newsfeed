<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Regiepult. Kopfzeile mit Farbbalken, der zugleich als Themenfilter dient,
   links die aufklappbaren Meldungen, rechts Schlagzeilen und Termine als Ablaufplan. */
:root {
  --bg: #E8EDEE;
  --surface: #F5F8F8;
  --ink: #10171A;
  --ink2: #46555C;
  --line: #C5CFD3;
  --accent: #D93A22;
  --accent-ink: #FFFFFF;
  --c-broadcast: #3566D0;
  --c-kamera: #C99700;
  --c-licht: #0E8FA8;
  --c-drohnen: #1C9B72;
  --c-schnitt: #B8379A;
  --c-foto: #7255D0;
  --c-ki: #DB6A14;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1316;
    --surface: #151D21;
    --ink: #E6ECEE;
    --ink2: #9BA9AF;
    --line: #28343A;
    --accent: #FF5B45;
    --accent-ink: #10171A;
    --c-broadcast: #6C98F2;
    --c-kamera: #F0C23A;
    --c-licht: #4CC9E0;
    --c-drohnen: #3ECF9D;
    --c-schnitt: #E36DC5;
    --c-foto: #A18CF2;
    --c-ki: #F4954A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1316;
  --surface: #151D21;
  --ink: #E6ECEE;
  --ink2: #9BA9AF;
  --line: #28343A;
  --accent: #FF5B45;
  --accent-ink: #10171A;
  --c-broadcast: #6C98F2;
  --c-kamera: #F0C23A;
  --c-licht: #4CC9E0;
  --c-drohnen: #3ECF9D;
  --c-schnitt: #E36DC5;
  --c-foto: #A18CF2;
  --c-ki: #F4954A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { min-width: 0; }
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(34px, 7vw, 54px);
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  text-wrap: balance;
}
.brand h1 span { font-weight: 500; color: var(--ink2); }
.edmeta { margin: 8px 0 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink2); letter-spacing: 0.02em; }
.edpick { display: flex; flex-direction: column; gap: 4px; }
.edpick label, .lbl {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink2);
}
select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 10px;
  min-width: 220px;
  max-width: 100%;
}

.bar { display: flex; gap: 2px; height: 14px; margin-top: 16px; }
.bar button {
  flex-grow: 1;
  flex-basis: 0;
  min-width: 6px;
  border: 0;
  padding: 0;
  border-radius: 1px;
  transition: opacity .15s;
}
.bar.filtered button:not([aria-pressed="true"]) { opacity: .22; }

.intro { max-width: 70ch; margin: 22px 0 0; font-size: 16.5px; line-height: 1.6; text-wrap: pretty; }
.intro.start { color: var(--ink2); font-size: 13.5px; margin-top: 6px; }

/* Raster */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 26px; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
  .rail { order: 2; }
  .main { order: 1; }
}
.rail { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.main { min-width: 0; }
@media (max-width: 899px) { .rail { order: 1; } .main { order: 2; } }

h2.sec {
  margin: 0 0 10px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Schlagzeilen */
.top { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.top li { border-bottom: 1px solid var(--line); }
.top button {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 10px 2px;
}
.top button:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.top .tt { font-weight: 600; line-height: 1.35; }
.top .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--cc, var(--c-schnitt)); flex: none; }

/* Termine */
.rundown { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rundown li { display: grid; grid-template-columns: 6.2ch minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.rundown .tc { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; padding-top: 1px; font-variant-numeric: tabular-nums; }
.rundown .tx { min-width: 0; }
.rundown .tag {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid var(--ink2);
  border-radius: 3px;
  color: var(--ink2);
  vertical-align: 1px;
}
.rundown .heute .tc { color: var(--accent); }
.rundown .past { opacity: .5; }

/* Steuerung */
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 12px;
}
.search::placeholder { color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px 4px 9px;
  font-size: 13.5px;
}
.chip .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.linkbtn { background: none; border: 0; padding: 4px 2px; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink2); }
.linkbtn:hover { color: var(--ink); }
.count { margin: 0 0 4px; font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }

/* Meldungen */
.group { margin-top: 22px; }
.group:first-of-type { margin-top: 8px; }
.ghead { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--cc, var(--ink)); }
.ghead h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.ghead .gn { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
.flat { margin-top: 8px; border-top: 2px solid var(--ink); }

details.item { border-bottom: 1px solid var(--line); }
details.item > summary {
  list-style: none;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) 14px;
  gap: 12px;
  align-items: start;
  padding: 11px 2px;
  cursor: pointer;
}
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.t { display: block; font-weight: 600; line-height: 1.38; text-wrap: pretty; }
.item.read .t { font-weight: 500; color: var(--ink2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.badge {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid currentColor;
  border-radius: 3px;
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  line-height: 17px;
}
.badge.geruecht { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.neu { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.item.read .neu { display: none; }
.meter { display: inline-flex; align-items: center; gap: 3px; }
.meter i { width: 9px; height: 9px; border: 1px solid var(--ink); background: transparent; }
.meter i.on { background: var(--ink); }
.chev { width: 8px; height: 8px; margin-top: 8px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(-135deg); margin-top: 11px; }
.body { padding: 0 2px 16px 22px; max-width: 68ch; }
.body p { margin: 0 0 10px; text-wrap: pretty; }
.body .why { color: var(--ink2); }
.body .why b { color: var(--ink); font-weight: 600; }
.body .src {
  display: inline-block;
  font-size: 13.5px;
  font-weight: 500;
  padding: 5px 10px;
  border: 1px solid var(--ink);
  border-radius: 4px;
  text-decoration: none;
}
.body .src:hover { background: var(--ink); color: var(--bg); }
.empty { padding: 28px 0; }
.empty p { margin: 0 0 8px; }

@media (prefers-reduced-motion: reduce) {
  .chev, .bar button { transition: none; }
}

/* Reiter */
.tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 2px solid var(--ink); }
.tabs button {
  flex: 0 1 auto;
  background: none;
  border: 0;
  padding: 8px 18px 6px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink2);
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 480px) { .tabs button { flex: 1 1 0; padding-inline: 6px; font-size: 17px; letter-spacing: .03em; white-space: nowrap; } }

/* Best of YouTube */
.topn { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); counter-reset: rang; }
.topn li { border-bottom: 1px solid var(--line); counter-increment: rang; }
.topn a {
  display: grid;
  grid-template-columns: 2.2ch minmax(0, 1fr);
  gap: 10px;
  padding: 10px 2px;
  text-decoration: none;
}
.topn a::before { content: counter(rang); font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--cc, var(--ink2)); }
.topn a:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.topn .tt { display: block; font-weight: 600; line-height: 1.35; }
.topn .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.meth summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  cursor: pointer;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.meth summary::-webkit-details-marker { display: none; }
.meth summary::after { content: "+"; font-family: var(--f-mono); font-weight: 400; }
.meth[open] summary::after { content: "\2013"; }
.method { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink2); max-width: 60ch; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px 14px; margin-top: 12px; }
.vcard { display: flex; flex-direction: column; gap: 3px; min-width: 0; text-decoration: none; }
.vcard .thumb {
  position: relative;
  display: block;
  aspect-ratio: 16 / 9;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  border-bottom: 3px solid var(--cc, var(--ink));
}
.vcard .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.vcard .dur, .vcard .fmt {
  position: absolute;
  bottom: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--f-mono);
  font-size: 11px;
  line-height: 18px;
  background: rgba(0, 0, 0, .78);
  color: #fff;
}
.vcard .dur { right: 6px; }
.vcard .fmt { left: 6px; background: var(--accent); color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.vcard .vt { margin-top: 4px; font-weight: 600; line-height: 1.35; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vcard:hover .vt { text-decoration: underline; text-underline-offset: 3px; }
.vcard .vk { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .vs { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); line-height: 1.5; }
.vcard .vs b { color: var(--ink); font-weight: 500; }
.vcard .tagm {
  position: absolute;
  top: 6px;
  left: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  line-height: 18px;
  letter-spacing: .06em;
  background: var(--ink);
  color: var(--bg);
}
.ynote { margin: 14px 0 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; background: var(--surface); }
</style>

  function catColor(id) { return 'var(--c-' + id + ')'; }

  var read = {};
  try { read = JSON.parse(localStorage.getItem(READ_KEY) || '{}') || {}; } catch (e) { read = {}; }
  function saveRead() { try { localStorage.setItem(READ_KEY, JSON.stringify(read)); } catch (e) {} }
  function ikey(ed, it) { return ed.key + '/' + it.id; }

  var state = { ed: DATA.length - 1, cats: {}, typ: 'alle', q: '', unread: false, view: 'thema' };

  function ed() { return DATA[state.ed]; }
  function catActive() { return Object.keys(state.cats).length > 0; }

  function visible() {
    var e = ed();
    var q = state.q.trim().toLowerCase();
    return e.items.filter(function (it) {
      if (catActive() && !state.cats[it.kat]) return false;
      if (state.typ !== 'alle' && it.typ !== state.typ) return false;
      if (state.unread && read[ikey(e, it)]) return false;
      if (q) {
        var hay = (it.titel + ' ' + it.kurz + ' ' + (it.warum || '') + ' ' + it.quelle + ' ' + CAT[it.kat].label).toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
  }

  function toggleCat(id) {
    if (state.cats[id]) delete state.cats[id]; else state.cats[id] = true;
    renderBar(); renderChips(); renderList();
  }

  function renderHead() {
    var e = ed();
    var sel = $('edition');
    sel.textContent = '';
    for (var i = DATA.length - 1; i >= 0; i--) {
      var d = DATA[i];
      var o = h('option', { value: String(i), text: 'KW ' + d.kw + ' · ' + range(d.von, d.bis) });
      if (i === state.ed) o.selected = true;
      sel.appendChild(o);
    }
    $('edmeta').textContent = 'KW ' + e.kw + ' · ' + range(e.von, e.bis) + ' · Stand ' + dmy(e.stand) + ' · ' + e.items.length + ' Meldungen';
    $('intro').textContent = e.intro;
    var sn = $('startnote');
    if (e.hinweis) { sn.textContent = e.hinweis; sn.hidden = false; } else { sn.hidden = true; }
  }

  function counts() {
    var c = {};
    ed().items.forEach(function (it) { c[it.kat] = (c[it.kat] || 0) + 1; });
    return c;
  }

  function renderBar() {
    var bar = $('bar'), c = counts();
    bar.textContent = '';
    bar.className = 'bar' + (catActive() ? ' filtered' : '');
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var b = h('button', {
        type: 'button',
        'aria-pressed': state.cats[cat.id] ? 'true' : 'false',
        'aria-label': cat.label + ', ' + c[cat.id] + ' Meldungen',
        title: cat.label + ' (' + c[cat.id] + ')'
      });
      b.style.background = catColor(cat.id);
      b.style.flexGrow = String(c[cat.id]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      bar.appendChild(b);
    });
  }

  function renderChips() {
    var box = $('chips'), c = counts();
    box.textContent = '';
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var dot = h('span', { class: 'dot' });
      dot.style.setProperty('--cc', catColor(cat.id));
      dot.style.marginTop = '0';
      var b = h('button', { type: 'button', class: 'chip', 'aria-pressed': state.cats[cat.id] ? 'true' : 'false' },
        [dot, cat.label, h('span', { class: 'n', text: String(c[cat.id]) })]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      box.appendChild(b);
    });
  }

  function renderSeg(id, opts, key) {
    var box = $(id);
    box.textContent = '';
    opts.forEach(function (o) {
      var b = h('button', { type: 'button', 'aria-pressed': state[key] === o[0] ? 'true' : 'false', text: o[1] });
      b.addEventListener('click', function () { state[key] = o[0]; renderSeg(id, opts, key); renderList(); });
      box.appendChild(b);
    });
  }

  function renderTop() {
    var e = ed(), ul = $('top');
    ul.textContent = '';
    e.items.filter(function (it) { return it.schlagzeile; }).forEach(function (it) {
      var dot = h('span', { class: 'dot' });
      dot.style.setProperty('--cc', catColor(it.kat));
      var sub = CAT[it.kat].label + (it.typ === 'geruecht' ? ' · Gerücht' : '');
      var b = h('button', { type: 'button' }, [dot, h('span', {}, [h('span', { class: 'tt', text: it.titel }), h('span', { class: 'ts', text: sub })])]);
      b.addEventListener('click', function () { openItem(it.id); });
      ul.appendChild(h('li', {}, [b]));
    });
  }

  function renderTermine() {
    var e = ed(), ol = $('termine');
    ol.textContent = '';
    var list = (e.termine || []).slice().sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0; });
    list.forEach(function (t) {
      var cls = t.datum < e.stand ? 'past' : (t.datum === e.stand ? 'heute' : '');
      var tx = h('span', { class: 'tx' }, [t.text]);
      if (t.datum === e.stand) tx.appendChild(h('span', { class: 'tag', text: 'heute' }));
      if (t.geruecht) tx.appendChild(h('span', { class: 'tag', text: 'Gerücht' }));
      ol.appendChild(h('li', { class: cls }, [h('span', { class: 'tc', text: t.label || dm(t.datum) }), tx]));
    });
    $('h-term').parentNode.hidden = list.length === 0;
  }

  function row(e, it, showCat) {
    var key = ikey(e, it);
    var dot = h('span', { class: 'dot' });
    dot.style.setProperty('--cc', catColor(it.kat));
    var meta = h('span', { class: 'meta' });
    meta.appendChild(h('span', { class: 'neu', title: 'Ungelesen' }));
    meta.appendChild(h('span', { class: 'badge ' + it.typ, text: TYP[it.typ] }));
    if (it.typ === 'geruecht' && it.sicherheit) {
      var m = h('span', { class: 'meter', role: 'img', 'aria-label': 'Glaubwürdigkeit ' + it.sicherheit + ' von 3: ' + SICH[it.sicherheit], title: SICH[it.sicherheit] });
      for (var i = 1; i <= 3; i++) m.appendChild(h('i', { class: i <= it.sicherheit ? 'on' : '' }));
      meta.appendChild(m);
      meta.appendChild(h('span', { text: SICH[it.sicherheit] }));
    }
    meta.appendChild(h('span', { text: it.datum ? dm(it.datum) : (it.datum_hinweis || 'ohne Datum') }));
    meta.appendChild(h('span', { text: it.quelle }));
    if (it.hintergrund) meta.appendChild(h('span', { class: 'badge', text: 'Hintergrund' }));
    if (showCat) meta.appendChild(h('span', { text: CAT[it.kat].label }));

    var sum = h('summary', {}, [dot, h('span', {}, [h('span', { class: 't', text: it.titel }), meta]), h('span', { class: 'chev' })]);
    var body = h('div', { class: 'body' }, [h('p', { text: it.kurz })]);
    if (it.warum) body.appendChild(h('p', { class: 'why' }, [h('b', { text: 'Warum es zählt: ' }), it.warum]));
    body.appendChild(h('a', { class: 'src', href: safeUrl(it.url), target: '_blank', rel: 'noopener noreferrer', text: 'Quelle: ' + it.quelle + ' ↗' }));

    var d = h('details', { class: 'item' + (read[key] ? ' read' : ''), id: 'it-' + it.id }, [sum, body]);
    sum.addEventListener('click', function () { if (!d.open) markRead(d, key); });
    return d;
  }

  function markRead(d, key) {
    read[key] = 1; saveRead();
    d.classList.add('read');
    updateCount();
  }

  var lastShown = 0;
  function updateCount() {
    var e = ed();
    var unread = e.items.filter(function (it) { return !read[ikey(e, it)]; }).length;
    $('count').textContent = lastShown + ' von ' + e.items.length + ' Meldungen · ' + unread + ' ungelesen';
  }

  function renderList() {
    var e = ed(), items = visible(), box = $('list');
    box.textContent = '';
    lastShown = items.length;
    $('toggleall').textContent = 'Alle öffnen';
    updateCount();
    if (!items.length) {
      var reset = h('button', { type: 'button', class: 'linkbtn', text: 'Filter zurücksetzen' });
      reset.addEventListener('click', resetFilters);
      box.appendChild(h('div', { class: 'empty' }, [h('p', { text: 'Keine Meldung passt zu diesen Filtern.' }), reset]));
      return;
    }
    if (state.view === 'datum') {
      var sorted = items.slice().sort(function (a, b) {
        var da = a.datum || '', db = b.datum || '';
        return da < db ? 1 : da > db ? -1 : 0;
      });
      var flat = h('div', { class: 'flat' });
      sorted.forEach(function (it) { flat.appendChild(row(e, it, true)); });
      box.appendChild(flat);
      return;
    }
    CATS.forEach(function (cat) {
      var g = items.filter(function (it) { return it.kat === cat.id; });
      if (!g.length) return;
      var head = h('div', { class: 'ghead' }, [h('h3', { text: cat.label }), h('span', { class: 'gn', text: String(g.length) })]);
      var sec = h('section', { class: 'group' }, [head]);
      sec.style.setProperty('--cc', catColor(cat.id));
      g.forEach(function (it) { sec.appendChild(row(e, it, false)); });
      box.appendChild(sec);
    });
  }

  function resetFilters() {
    state.cats = {}; state.typ = 'alle'; state.q = ''; state.unread = false;
    $('q').value = ''; $('unread').checked = false;
    renderBar(); renderChips(); renderSeg('typ', TYP_OPTS, 'typ'); renderList();
  }

  function openItem(id) {
    var e = ed();
    var hit = visible().some(function (it) { return it.id === id; });
    if (!hit) resetFilters();
    var d = document.getElementById('it-' + id);
    if (!d) return;
    d.open = true;
    var it = e.items.filter(function (x) { return x.id === id; })[0];
    if (it) markRead(d, ikey(e, it));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    d.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
    var s = d.querySelector('summary');
    if (s) s.focus({ preventScroll: true });
  }

  var TYP_OPTS = [['alle', 'Alle'], ['news', 'News'], ['update', 'Updates'], ['geruecht', 'Gerüchte']];
  var VIEW_OPTS = [['thema', 'Nach Thema'], ['datum', 'Nach Datum']];

  function renderAll() {
    renderHead(); renderBar(); renderChips();
    renderSeg('typ', TYP_OPTS, 'typ');
    renderSeg('view', VIEW_OPTS, 'view');
    renderTop(); renderTermine(); renderList();
  }

  if (!DATA.length) {
    $('intro').textContent = 'Noch keine Ausgabe vorhanden.';
    return;
  }

  $('edition').addEventListener('change', function (ev) {
    state.ed = parseInt(ev.target.value, 10);
    state.cats = {};
    renderAll();
  });
  $('q').addEventListener('input', function (ev) { state.q = ev.target.value; renderList(); });
  $('unread').addEventListener('change', function (ev) { state.unread = ev.target.checked; renderList(); });
  $('toggleall').addEventListener('click', function () {
    var ds = Array.prototype.slice.call(document.querySelectorAll('#list details.item'));
    var anyClosed = ds.some(function (d) { return !d.open; });
    ds.forEach(function (d) { d.open = anyClosed; });
    $('toggleall').textContent = anyClosed ? 'Alle schließen' : 'Alle öffnen';
  });
  $('markall').addEventListener('click', function () {
    var e = ed();
    e.items.forEach(function (it) { read[ikey(e, it)] = 1; });
    saveRead();
    Array.prototype.forEach.call(document.querySelectorAll('#list details.item'), function (d) { d.classList.add('read'); });
    updateCount();
    if (state.unread) renderList();
  });

  renderAll();
})();
</script>

<script>
/* Reiter "Best of YouTube". Die Daten kommen aus youtube/aktuell.json (feed/youtube_fetch.py).
   Gibt es keine Daten, bleibt die Reiterleiste versteckt und die Seite zeigt nur den Wochenblick. */
(function () {
  'use strict';
  var YT = /*__YT__*/null;
  if (!YT || !YT.items || !YT.items.length) return;

  var CATS = [
    { id: 'kamera', label: 'Kameras & Audio' },
    { id: 'licht', label: 'Licht & Beleuchtung' },
    { id: 'drohnen', label: 'Drohnen & FPV' },
    { id: 'schnitt', label: 'Schnitt' },
    { id: 'ki', label: 'KI & Automation' },
    { id: 'foto', label: 'Foto' },
    { id: 'broadcast', label: 'Broadcast' }
  ];
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var ID_OK = /^[A-Za-z0-9_-]{11}$/;
  var ITEMS = YT.items.filter(function (it) { return ID_OK.test(it.id) && CAT[it.kat]; });
  if (!ITEMS.length) return;
  var T0 = Date.parse(YT.erzeugt) || Date.now();
  var SCHW = YT.schwerpunkte || {};
  var SCHW_ID = Object.keys(SCHW)[0] || null;

  function $(id) { return document.getElementById(id); }
  function h(tag, props, kids) {
    var n = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === 'class') n.className = props[k];
        else if (k === 'text') n.textContent = props[k];
        else n.setAttribute(k, props[k]);
      });
    }
    (kids || []).forEach(function (c) {
      if (c == null) return;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return n;
  }
  function dmy(iso) { var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function catColor(id) { return 'var(--c-' + id + ')'; }
  function kompakt(n) {
    if (n == null) return '–';
    var d = function (x) { return String(Math.round(x * 10) / 10).replace('.', ','); };
    if (n >= 1e6) return d(n / 1e6) + ' Mio.';
    if (n >= 1e4) return Math.round(n / 1e3) + ' Tsd.';
    try { return n.toLocaleString('de-CH'); } catch (e) { return String(n); }
  }
  function dauer(s) {
    var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    var z = function (x) { return (x < 10 ? '0' : '') + x; };
    return hh ? hh + ':' + z(mm) + ':' + z(ss) : mm + ':' + z(ss);
  }
  function alter(iso) {
    var std = (T0 - Date.parse(iso)) / 36e5;
    if (std < 1) return 'vor weniger als 1 Std.';
    if (std < 24) return 'vor ' + Math.floor(std) + ' Std.';
    var d = Math.floor(std / 24);
    return d === 1 ? 'vor 1 Tag' : 'vor ' + d + ' Tagen';
  }
  function url(it) { return 'https://www.youtube.com/watch?v=' + it.id; }

  var SORT = {
    trend: function (a, b) { return b.trend - a.trend; },
    aufrufe: function (a, b) { return b.aufrufe - a.aufrufe; },
    likes: function (a, b) { return (b.likes == null ? -1 : b.likes) - (a.likes == null ? -1 : a.likes); },
    neu: function (a, b) { return Date.parse(b.veroeffentlicht) - Date.parse(a.veroeffentlicht); }
  };
  var FMT_OPTS = [['alle', 'Alle'], ['video', 'Videos'], ['short', 'Shorts']];
  var SORT_OPTS = [['trend', 'Trend'], ['aufrufe', 'Aufrufe'], ['likes', 'Likes'], ['neu', 'Neueste']];
  var VIEW_OPTS = [['thema', 'Nach Rubrik'], ['gesamt', 'Gesamtranking']];
  var state = { cats: {}, fmt: 'alle', sort: 'trend', q: '', view: 'thema', schw: false };

  function catActive() { return Object.keys(state.cats).length > 0; }
  function visible() {
    var q = state.q.trim().toLowerCase();
    return ITEMS.filter(function (it) {
      if (catActive() && !state.cats[it.kat]) return false;
      if (state.fmt !== 'alle' && it.format !== state.fmt) return false;
      if (state.schw && it.schwerpunkt !== SCHW_ID) return false;
      if (q && (it.titel + ' ' + it.kanal + ' ' + CAT[it.kat].label).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }
  function counts() {
    var c = {};
    ITEMS.forEach(function (it) { c[it.kat] = (c[it.kat] || 0) + 1; });
    return c;
  }
  function toggleCat(id) {
    if (state.cats[id]) delete state.cats[id]; else state.cats[id] = true;
    renderBar(); renderChips(); renderList();
  }

  function renderBar() {
    var bar = $('y-bar'), c = counts();
    bar.textContent = '';
    bar.className = 'bar' + (catActive() ? ' filtered' : '');
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var b = h('button', {
        type: 'button',
        'aria-pressed': state.cats[cat.id] ? 'true' : 'false',
        'aria-label': cat.label + ', ' + c[cat.id] + ' Videos',
        title: cat.label + ' (' + c[cat.id] + ')'
      });
      b.style.background = catColor(cat.id);
      b.style.flexGrow = String(c[cat.id]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      bar.appendChild(b);
    });
  }

  function renderChips() {
    var box = $('y-chips'), c = counts();
    box.textContent = '';
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var dot = h('span', { class: 'dot' });
      dot.style.setProperty('--cc', catColor(cat.id));
      dot.style.marginTop = '0';
      var b = h('button', { type: 'button', class: 'chip', 'aria-pressed': state.cats[cat.id] ? 'true' : 'false' },
        [dot, cat.label, h('span', { class: 'n', text: String(c[cat.id]) })]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      box.appendChild(b);
    });
  }

  function renderSeg(id, opts, key) {
    var box = $(id);
    box.textContent = '';
    opts.forEach(function (o) {
      var b = h('button', { type: 'button', 'aria-pressed': state[key] === o[0] ? 'true' : 'false', text: o[1] });
      b.addEventListener('click', function () { state[key] = o[0]; renderSeg(id, opts, key); renderList(); });
      box.appendChild(b);
    });
  }

  function renderTop() {
    var ol = $('y-top');
    ol.textContent = '';
    ITEMS.slice().sort(SORT.trend).slice(0, 5).forEach(function (it) {
      var a = h('a', { href: url(it), target: '_blank', rel: 'noopener noreferrer' }, [
        h('span', {}, [
          h('span', { class: 'tt', text: it.titel }),
          h('span', { class: 'ts', text: CAT[it.kat].label + ' · ' + (it.format === 'short' ? 'Short' : 'Video') + ' · ' + kompakt(Math.round(it.trend)) + ' Aufrufe/Tag' })
        ])
      ]);
      a.style.setProperty('--cc', catColor(it.kat));
      ol.appendChild(h('li', {}, [a]));
    });
  }

  function card(it) {
    var img = h('img', {
      src: 'https://i.ytimg.com/vi/' + it.id + '/mqdefault.jpg',
      alt: '', width: '320', height: '180', loading: 'lazy', decoding: 'async', referrerpolicy: 'no-referrer'
    });
    img.addEventListener('error', function () { img.style.display = 'none'; });
    var thumb = h('span', { class: 'thumb' }, [
      img,
      it.format === 'short' ? h('span', { class: 'fmt', text: 'Short' }) : null,
      it.schwerpunkt && SCHW[it.schwerpunkt] ? h('span', { class: 'tagm', text: it.schwerpunkt.toUpperCase() }) : null,
      h('span', { class: 'dur', text: dauer(it.dauer_s) })
    ]);
    var s1 = h('span', { class: 'vs' }, [
      h('b', { text: kompakt(it.aufrufe) }), ' Aufrufe',
      it.likes != null ? ' · ' : null, it.likes != null ? h('b', { text: kompakt(it.likes) }) : null, it.likes != null ? ' Likes' : null
    ]);
    var s2 = h('span', { class: 'vs', text: alter(it.veroeffentlicht) + ' · ' + kompakt(Math.round(it.trend)) + '/Tag' });
    var a = h('a', {
      class: 'vcard', href: url(it), target: '_blank', rel: 'noopener noreferrer',
      'aria-label': it.titel + ' von ' + it.kanal + ' auf YouTube'
    }, [thumb, h('span', { class: 'vt', text: it.titel }), h('span', { class: 'vk', text: it.kanal }), s1, s2]);
    a.style.setProperty('--cc', catColor(it.kat));
    return a;
  }

  function renderList() {
    var items = visible().sort(SORT[state.sort]), box = $('y-list');
    box.textContent = '';
    $('y-count').textContent = items.length + ' von ' + ITEMS.length + ' Einträgen';
    if (!items.length) {
      var reset = h('button', { type: 'button', class: 'linkbtn', text: 'Filter zurücksetzen' });
      reset.addEventListener('click', function () {
        state.cats = {}; state.fmt = 'alle'; state.q = ''; state.schw = false; $('y-q').value = ''; $('y-schw').checked = false;
        renderBar(); renderChips(); renderSeg('y-fmt', FMT_OPTS, 'fmt'); renderList();
      });
      box.appendChild(h('div', { class: 'empty' }, [h('p', { text: 'Kein Eintrag passt zu diesen Filtern.' }), reset]));
      return;
    }
    if (state.view === 'gesamt') {
      var g = h('div', { class: 'vgrid' });
      items.forEach(function (it) { g.appendChild(card(it)); });
      box.appendChild(g);
      return;
    }
    var schwList = SCHW_ID ? items.filter(function (it) { return it.schwerpunkt === SCHW_ID; }) : [];
    if (schwList.length) {
      var sh = h('div', { class: 'ghead' }, [h('h3', { text: SCHW[SCHW_ID] }), h('span', { class: 'gn', text: String(schwList.length) })]);
      var sg = h('div', { class: 'vgrid' });
      schwList.forEach(function (it) { sg.appendChild(card(it)); });
      var ss = h('section', { class: 'group schw' }, [sh, sg]);
      ss.style.setProperty('--cc', 'var(--accent)');
      box.appendChild(ss);
    }
    CATS.forEach(function (cat) {
      var list = items.filter(function (it) { return it.kat === cat.id && !(SCHW_ID && it.schwerpunkt === SCHW_ID); });
      if (!list.length) return;
      var head = h('div', { class: 'ghead' }, [h('h3', { text: cat.label }), h('span', { class: 'gn', text: String(list.length) })]);
      var grid = h('div', { class: 'vgrid' });
      list.forEach(function (it) { grid.appendChild(card(it)); });
      var sec = h('section', { class: 'group' }, [head, grid]);
      sec.style.setProperty('--cc', catColor(cat.id));
      box.appendChild(sec);
    });
  }

  $('y-meta').textContent = 'Stand ' + dmy(YT.stand) + ' · letzte ' + YT.tage + ' Tage · ' + ITEMS.length + ' Einträge';
  $('y-method').textContent = YT.methode || '';
  if (YT.hinweis) { $('y-note').textContent = YT.hinweis; $('y-note').hidden = false; }
  $('y-q').addEventListener('input', function (ev) { state.q = ev.target.value; renderList(); });
  if (SCHW_ID) {
    $('y-schw-label').textContent = 'Nur ' + SCHW[SCHW_ID];
    $('y-schw-wrap').hidden = false;
    $('y-schw').addEventListener('change', function (ev) { state.schw = ev.target.checked; renderList(); });
  }
  renderBar(); renderChips();
  renderSeg('y-fmt', FMT_OPTS, 'fmt');
  renderSeg('y-sort', SORT_OPTS, 'sort');
  renderSeg('y-view', VIEW_OPTS, 'view');
  renderTop(); renderList();

  /* Reiter: #youtube in der Adresse öffnet den Bereich direkt */
  var tabs = $('tabs'), viewNews = $('view-news'), viewYt = $('view-yt');
  var tabBtns = Array.prototype.slice.call(tabs.querySelectorAll('button'));
  function show(view, push) {
    var yt = view === 'youtube';
    viewNews.hidden = yt;
    viewYt.hidden = !yt;
    tabBtns.forEach(function (b) {
      var on = b.getAttribute('data-view') === view;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    if (push) {
      try { history.replaceState(null, '', yt ? '#youtube' : location.pathname + location.search); } catch (e) {}
    }
  }
  tabBtns.forEach(function (b, i) {
    b.addEventListener('click', function () { show(b.getAttribute('data-view'), true); });
    b.addEventListener('keydown', function (ev) {
      if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
      var n = tabBtns[(i + (ev.key === 'ArrowRight' ? 1 : tabBtns.length - 1)) % tabBtns.length];
      show(n.getAttribute('data-view'), true);
      n.focus();
      ev.preventDefault();
    });
  });
  window.addEventListener('hashchange', function () { show(location.hash === '#youtube' ? 'youtube' : 'news', false); });
  tabs.hidden = false;
  show(location.hash === '#youtube' ? 'youtube' : 'news', false);
})();
</script>
