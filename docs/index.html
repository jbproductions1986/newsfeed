<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
</head>
<body>
<title>Wochenblick Bild &amp; Ton</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Regiepult. Kopfzeile mit Farbbalken, der zugleich als Themenfilter dient,
   links die aufklappbaren Meldungen, rechts Schlagzeilen und Termine als Ablaufplan. */
:root {
  --bg: #E8EDEE;
  --surface: #F5F8F8;
  --ink: #10171A;
  --ink2: #46555C;
  --line: #C5CFD3;
  --accent: #D93A22;
  --accent-ink: #FFFFFF;
  --c-broadcast: #3566D0;
  --c-kamera: #C99700;
  --c-licht: #0E8FA8;
  --c-drohnen: #1C9B72;
  --c-schnitt: #B8379A;
  --c-foto: #7255D0;
  --c-ki: #DB6A14;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1316;
    --surface: #151D21;
    --ink: #E6ECEE;
    --ink2: #9BA9AF;
    --line: #28343A;
    --accent: #FF5B45;
    --accent-ink: #10171A;
    --c-broadcast: #6C98F2;
    --c-kamera: #F0C23A;
    --c-licht: #4CC9E0;
    --c-drohnen: #3ECF9D;
    --c-schnitt: #E36DC5;
    --c-foto: #A18CF2;
    --c-ki: #F4954A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1316;
  --surface: #151D21;
  --ink: #E6ECEE;
  --ink2: #9BA9AF;
  --line: #28343A;
  --accent: #FF5B45;
  --accent-ink: #10171A;
  --c-broadcast: #6C98F2;
  --c-kamera: #F0C23A;
  --c-licht: #4CC9E0;
  --c-drohnen: #3ECF9D;
  --c-schnitt: #E36DC5;
  --c-foto: #A18CF2;
  --c-ki: #F4954A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { min-width: 0; }
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(34px, 7vw, 54px);
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  text-wrap: balance;
}
.brand h1 span { font-weight: 500; color: var(--ink2); }
.edmeta { margin: 8px 0 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink2); letter-spacing: 0.02em; }
.edpick { display: flex; flex-direction: column; gap: 4px; }
.edpick label, .lbl {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink2);
}
select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 10px;
  min-width: 220px;
  max-width: 100%;
}

.bar { display: flex; gap: 2px; height: 14px; margin-top: 16px; }
.bar button {
  flex-grow: 1;
  flex-basis: 0;
  min-width: 6px;
  border: 0;
  padding: 0;
  border-radius: 1px;
  transition: opacity .15s;
}
.bar.filtered button:not([aria-pressed="true"]) { opacity: .22; }

.intro { max-width: 70ch; margin: 22px 0 0; font-size: 16.5px; line-height: 1.6; text-wrap: pretty; }
.intro.start { color: var(--ink2); font-size: 13.5px; margin-top: 6px; }

/* Raster */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 26px; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
  .rail { order: 2; }
  .main { order: 1; }
}
.rail { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.main { min-width: 0; }
@media (max-width: 899px) { .rail { order: 1; } .main { order: 2; } }

h2.sec {
  margin: 0 0 10px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Schlagzeilen */
.top { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.top li { border-bottom: 1px solid var(--line); }
.top button {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 10px 2px;
}
.top button:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.top .tt { font-weight: 600; line-height: 1.35; }
.top .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--cc, var(--c-schnitt)); flex: none; }

/* Termine */
.rundown { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rundown li { display: grid; grid-template-columns: 6.2ch minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.rundown .tc { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; padding-top: 1px; font-variant-numeric: tabular-nums; }
.rundown .tx { min-width: 0; }
.rundown .tag {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid var(--ink2);
  border-radius: 3px;
  color: var(--ink2);
  vertical-align: 1px;
}
.rundown .heute .tc { color: var(--accent); }
.rundown .past { opacity: .5; }

/* Steuerung */
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 12px;
}
.search::placeholder { color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px 4px 9px;
  font-size: 13.5px;
}
.chip .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.linkbtn { background: none; border: 0; padding: 4px 2px; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink2); }
.linkbtn:hover { color: var(--ink); }
.count { margin: 0 0 4px; font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }

/* Meldungen */
.group { margin-top: 22px; }
.group:first-of-type { margin-top: 8px; }
.ghead { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--cc, var(--ink)); }
.ghead h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.ghead .gn { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
.flat { margin-top: 8px; border-top: 2px solid var(--ink); }

details.item { border-bottom: 1px solid var(--line); }
details.item > summary {
  list-style: none;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) 14px;
  gap: 12px;
  align-items: start;
  padding: 11px 2px;
  cursor: pointer;
}
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.t { display: block; font-weight: 600; line-height: 1.38; text-wrap: pretty; }
.item.read .t { font-weight: 500; color: var(--ink2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.badge {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid currentColor;
  border-radius: 3px;
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  line-height: 17px;
}
.badge.geruecht { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.neu { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.item.read .neu { display: none; }
.meter { display: inline-flex; align-items: center; gap: 3px; }
.meter i { width: 9px; height: 9px; border: 1px solid var(--ink); background: transparent; }
.meter i.on { background: var(--ink); }
.chev { width: 8px; height: 8px; margin-top: 8px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(-135deg); margin-top: 11px; }
.body { padding: 0 2px 16px 22px; max-width: 68ch; }
.body p { margin: 0 0 10px; text-wrap: pretty; }
.body .why { color: var(--ink2); }
.body .why b { color: var(--ink); font-weight: 600; }
.body .src {
  display: inline-block;
  font-size: 13.5px;
  font-weight: 500;
  padding: 5px 10px;
  border: 1px solid var(--ink);
  border-radius: 4px;
  text-decoration: none;
}
.body .src:hover { background: var(--ink); color: var(--bg); }
.empty { padding: 28px 0; }
.empty p { margin: 0 0 8px; }

@media (prefers-reduced-motion: reduce) {
  .chev, .bar button { transition: none; }
}

/* Reiter */
.tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 2px solid var(--ink); }
.tabs button {
  flex: 0 1 auto;
  background: none;
  border: 0;
  padding: 8px 18px 6px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink2);
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 480px) { .tabs button { flex: 1 1 0; padding-inline: 6px; font-size: 17px; letter-spacing: .03em; white-space: nowrap; } }

/* Best of YouTube */
.topn { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); counter-reset: rang; }
.topn li { border-bottom: 1px solid var(--line); counter-increment: rang; }
.topn a {
  display: grid;
  grid-template-columns: 2.2ch minmax(0, 1fr);
  gap: 10px;
  padding: 10px 2px;
  text-decoration: none;
}
.topn a::before { content: counter(rang); font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--cc, var(--ink2)); }
.topn a:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.topn .tt { display: block; font-weight: 600; line-height: 1.35; }
.topn .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.meth summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  cursor: pointer;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.meth summary::-webkit-details-marker { display: none; }
.meth summary::after { content: "+"; font-family: var(--f-mono); font-weight: 400; }
.meth[open] summary::after { content: "\2013"; }
.method { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink2); max-width: 60ch; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px 14px; margin-top: 12px; }
.vcard { display: flex; flex-direction: column; gap: 3px; min-width: 0; text-decoration: none; }
.vcard .thumb {
  position: relative;
  display: block;
  aspect-ratio: 16 / 9;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  border-bottom: 3px solid var(--cc, var(--ink));
}
.vcard .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.vcard .dur, .vcard .fmt {
  position: absolute;
  bottom: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--f-mono);
  font-size: 11px;
  line-height: 18px;
  background: rgba(0, 0, 0, .78);
  color: #fff;
}
.vcard .dur { right: 6px; }
.vcard .fmt { left: 6px; background: var(--accent); color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.vcard .vt { margin-top: 4px; font-weight: 600; line-height: 1.35; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vcard:hover .vt { text-decoration: underline; text-underline-offset: 3px; }
.vcard .vk { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .vs { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); line-height: 1.5; }
.vcard .vs b { color: var(--ink); font-weight: 500; }
.vcard .tagm {
  position: absolute;
  top: 6px;
  left: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  line-height: 18px;
  letter-spacing: .06em;
  background: var(--ink);
  color: var(--bg);
}
.ynote { margin: 14px 0 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; background: var(--surface); }
</style>

<div class="wrap">
  <noscript><p>Diese Seite braucht JavaScript, um die Meldungen anzuzeigen.</p></noscript>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Bereiche" hidden>
    <button type="button" role="tab" id="tab-news" aria-controls="view-news" aria-selected="true" data-view="news">Wochenblick</button>
    <button type="button" role="tab" id="tab-yt" aria-controls="view-yt" aria-selected="false" data-view="youtube" tabindex="-1">Best of YouTube</button>
  </nav>
  <div id="view-news" role="tabpanel" aria-labelledby="tab-news">
  <header class="masthead">
    <div class="brand">
      <h1>Wochenblick <span>Bild &amp; Ton</span></h1>
      <p class="edmeta" id="edmeta"></p>
    </div>
    <div class="edpick">
      <label for="edition">Ausgabe</label>
      <select id="edition"></select>
    </div>
  </header>
  <div class="bar" id="bar" role="group" aria-label="Themen nach Anzahl der Meldungen"></div>

  <p class="intro" id="intro"></p>
  <p class="intro start" id="startnote" hidden></p>

  <div class="grid">
    <aside class="rail">
      <section aria-labelledby="h-top">
        <h2 class="sec" id="h-top">Schlagzeilen</h2>
        <ul class="top" id="top"></ul>
      </section>
      <section aria-labelledby="h-term">
        <h2 class="sec" id="h-term">Termine</h2>
        <ol class="rundown" id="termine"></ol>
      </section>
    </aside>

    <main class="main">
      <div class="controls">
        <div>
          <label class="lbl" for="q">Suche</label>
          <input class="search" id="q" type="search" placeholder="Marke, Modell, Stichwort" autocomplete="off">
        </div>
        <div class="chips" id="chips" role="group" aria-label="Themen filtern"></div>
        <div class="row2">
          <div class="seg" id="typ" role="group" aria-label="Art der Meldung"></div>
          <div class="seg" id="view" role="group" aria-label="Sortierung"></div>
          <label class="chk" for="unread"><input type="checkbox" id="unread"> Nur ungelesen</label>
          <button class="linkbtn" id="toggleall" type="button">Alle öffnen</button>
          <button class="linkbtn" id="markall" type="button">Alle als gelesen</button>
        </div>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <div id="list"></div>
    </main>
  </div>
  </div>

  <div id="view-yt" role="tabpanel" aria-labelledby="tab-yt" hidden>
    <header class="masthead">
      <div class="brand">
        <h1>Best of <span>YouTube</span></h1>
        <p class="edmeta" id="y-meta"></p>
      </div>
    </header>
    <div class="bar" id="y-bar" role="group" aria-label="Rubriken nach Anzahl der Videos"></div>
    <p class="ynote" id="y-note" hidden></p>

    <div class="grid">
      <aside class="rail">
        <section aria-labelledby="y-h-top">
          <h2 class="sec" id="y-h-top">Top 5 gesamt</h2>
          <ol class="topn" id="y-top"></ol>
        </section>
        <details class="meth">
          <summary>So wird gewertet</summary>
          <p class="method" id="y-method"></p>
        </details>
      </aside>

      <main class="main">
        <div class="controls">
          <div>
            <label class="lbl" for="y-q">Suche</label>
            <input class="search" id="y-q" type="search" placeholder="Titel oder Kanal" autocomplete="off">
          </div>
          <div class="chips" id="y-chips" role="group" aria-label="Rubriken filtern"></div>
          <div class="row2">
            <div class="seg" id="y-fmt" role="group" aria-label="Format"></div>
            <div class="seg" id="y-sort" role="group" aria-label="Sortierung"></div>
            <div class="seg" id="y-view" role="group" aria-label="Ansicht"></div>
            <label class="chk" id="y-schw-wrap" for="y-schw" hidden><input type="checkbox" id="y-schw"> <span id="y-schw-label"></span></label>
          </div>
        </div>
        <p class="count" id="y-count" aria-live="polite"></p>
        <div id="y-list"></div>
      </main>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

10-Bit-Rendering auf NVIDIA-Karten, einen Absturz auf Intel und Probleme in der Render-Warteschlange. Version 1.6.2 (19. August) brachte ProRes RAW, Insta360 Go Ultra, FFmpeg 8.0 und neue BRAW- und R3D-SDKs.","warum":"Keine neue Version in dieser Woche. Stand zum Nachschlagen.","quelle":"GitHub","url":"https://github.com/gyroflow/gyroflow/releases","datum":"2026-09-04"},{"id":"resolve-21-stand","kat":"schnitt","typ":"update","hintergrund":true,"titel":"DaVinci Resolve 21: Stand der Dinge","kurz":"Resolve 21 (April) brachte eine Photo-Page und KI-Werkzeuge wie IntelliSearch und CineFocus. Zuletzt erschien Version 21.0.2 am 1. Juli mit schnellerem Bypass-Wechsel und besserer H.265-Wiedergabe auf NVIDIA-GPUs. Für Tests mit KI-Assistenten wird bereits Version 21.1 Studio genutzt.","warum":"Keine neue Resolve-Meldung in dieser Woche.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/07/01/davinci-resolve-21-0-2-update/","datum":"2026-07-01"},{"id":"adobe-max-2026","kat":"schnitt","typ":"news","titel":"Adobe MAX: 10. bis 12. November in Miami Beach","kurz":"Mehr als 200 Sessions in sieben Tracks, darunter „Accelerating Creativity with AI“ sowie Video, Audio und Motion. Die Vorkonferenz läuft am 8. und 9. November, eine Online-Teilnahme ist möglich.","warum":"Adobe stellt dort üblicherweise neue Firefly- und Premiere-Funktionen vor.","quelle":"Adobe MAX","url":"https://max.adobe.com/","datum":null,"datum_hinweis":"Termin"},{"id":"premiere-paper-edit","kat":"schnitt","typ":"news","titel":"Premiere: Highlights per Paper Edit im Transkript-Panel","kurz":"Der Dienstagstipp von Jeff Greenberg zeigt, wie sich im Transkript-Panel die stärksten Momente per Paper Edit herausziehen lassen. Der Tipp davor verhindert, dass Premiere beim Schneiden automatisch Spuren anlegt.","warum":"Zwei kleine Workflow-Gewinne ohne neue Software.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/tool-tip-tuesday-for-adobe-premiere-grab-the-best-moments-in-the-transcript-panel-with-paper-edit/","datum":"2026-10-13"},{"id":"nle-ki-assistenten-test","kat":"ki","typ":"news","schlagzeile":true,"hintergrund":true,"titel":"Test: KI-Assistenten in Premiere und Resolve","kurz":"ProVideo Coalition ließ den Premiere-Assistenten (Beta) und Resolve 21.1 Studio mit Claude 19 Interviewclips auf eigene Timelines verteilen und Stringouts bauen. Beide schafften die Grundaufgaben, brauchten aber Nachbesserung. Resolve war bei Wiederholungsarbeit schneller, Premiere lieferte genauere Rückmeldungen. Bei Farbe, Audio-Keyframes und Grafikskalierung versagten beide teilweise. Premiere nutzt kostenlose tägliche Firefly-Credits, die Adobe nicht garantiert.","warum":"Der wichtigste Realitätscheck für alle, die den Schnitt per KI vereinfachen wollen: Der Zeitgewinn ist offen, ein schneller Cutter ist von Hand oft flotter.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/battle-of-the-nle-ai-assistants/","datum":null,"datum_hinweis":"vor ca. 4 Wochen"},{"id":"rohschnitt-tools-mcp","kat":"ki","typ":"news","titel":"Rohschnitt-Tools und MCP-Brücken für Editoren","kurz":"Iain Andersons Roundup nennt Doza Assist, PowerCut, RoughCut und Cutler (Beta) für automatische Rohschnitte sowie Jumper, das eigene KI-Werkzeuge per MCP an den Schnittplatz anbindet. FCP Extender bringt Generative Extend für Final Cut, abgerechnet über Credits.","warum":"Viele dieser Tools entstehen mit KI-Coding. Sie sind klein, schnell und oft günstiger als große Suiten.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/roundup-new-software-for-video-editors/","datum":"2026-10-05"},{"id":"compositor-opencine","kat":"foto","typ":"news","titel":"Compositor: freie Open-Source-Alternative zu Photoshop","kurz":"Robbie Tilton baut Compositor als kostenlose, quelloffene Photoshop-Alternative. Ein gewünschtes Feature (Filter Layers) kam laut Roundup binnen eines Tages dazu. Ebenfalls dabei: OpenPocketCine, eine freie Begleit-App für DJI-Osmo-Kameras mit Monitor, Scopes und Kamerasteuerung, sowie Softbox zur Hautglättung.","warum":"Foto-Compositing und Osmo-Monitoring ohne Abo.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/roundup-new-software-for-video-editors/","datum":"2026-10-05"},{"id":"getty-glaeubigerschutz","kat":"foto","typ":"news","titel":"Getty Images beantragt Gläubigerschutz","kurz":"Getty will laut CineD Schulden abbauen und in private Hand übergehen. Für Contributor soll sich nichts ändern.","warum":"Wichtig für Stockfoto-Lizenzierung und die Einnahmen von Fotografen.","quelle":"CineD","url":"https://www.cined.com/getty-images-to-file-for-bankruptcy-protection-debt-cut-private-ownership-no-change-for-contributors/","datum":"2026-10-13"},{"id":"macos-27-update","kat":"schnitt","typ":"news","titel":"macOS 27 „Golden Gate“: schon updaten?","kurz":"CineD prüft, ob Videoeditoren das Update auf macOS 27 schon wagen können.","warum":"Bis zur Klärung Resolve, Premiere und Plugins gegen die Kompatibilitätslisten der Hersteller prüfen.","quelle":"CineD","url":"https://www.cined.com/macos-27-golden-gate-for-video-editors-is-it-safe-to-update-yet/","datum":"2026-10-12"}],"key":"2026-KW42"},{"jahr":2026,"kw":43,"von":"2026-10-14","bis":"2026-10-19","stand":"2026-10-19","intro":"Vor der NAB Show New York (21.–22. Oktober) kommen die IP-Themen in Fahrt: ein ST-2110-Neubau an einer US-Universität, eine Cloud-Plattform auf Basis des offenen TAMS-Standards und eine IP-Intercom ohne Zentralmatrix. Neu in dieser aktualisierten Ausgabe sind UniFi Network 11 von Ubiquiti, Hintergründe zu Bitfocus Companion und Stream Deck sowie MCP-Anbindungen und KI-Nachbauten bei Creator-Programmen von Resolve 21.1 bis ArtCraft.","hinweis":"Aktualisiert am 19. Oktober nachmittags: Broadcast liegt jetzt auf IP-Technik und Automatisierung und umfasst Steuerung (Bitfocus Companion, Stream Deck) und Netzwerk (Ubiquiti UniFi). Meldungen mit der Marke Hintergrund sind älter als der Berichtszeitraum. Mehrere Quellen (u. a. Nikon Rumors, Sony Alpha Rumors, Canon Rumors) waren im automatischen Lauf nicht abrufbar, Meldungen mit nur gelesener Überschrift sind knapp gehalten. Korrektur zur Vorwoche: Die NAB Show New York findet am 21. und 22. Oktober statt, nicht am 20. und 21. Oktober.","termine":[{"datum":"2026-10-20","text":"DJI Osmo Pocket 4P in Pearl White, Teaser-Launch 12 Uhr GMT (nicht in den USA)"},{"datum":"2026-10-21","label":"21.–22.10.","text":"NAB Show New York, Javits Center (u. a. ENCO, Pliant, MultiDyne, Cerberus Tech/Matrox, Imagine Communications)"},{"datum":"2026-10-24","text":"Sigma Produktevent, mögliches Objektiv: 65 mm f/1.1 oder f/1.0","geruecht":true},{"datum":"2026-10-29","text":"FCC-Abstimmung über chinesische Prüflabore"},{"datum":"2026-10-30","label":"Ende Okt.","text":"Nikkor Z 120-300 mm f/2.8 TC VR S erwartet","geruecht":true},{"datum":"2026-10-31","text":"DJI beendet Reparaturen der Phantom 4 Pro V2"},{"datum":"2026-11-01","label":"Nov.","text":"Nikon Z70 erwartet","geruecht":true},{"datum":"2026-11-10","label":"10.–12.11.","text":"Adobe MAX, Miami Beach (auch online)"}],"items":[{"id":"huskervision-st2110","kat":"broadcast","typ":"news","schlagzeile":true,"titel":"HuskerVision baut ST-2110-Produktion für alle Sportstätten der Uni Nebraska","kurz":"Die Videoabteilung der University of Nebraska Athletics ersetzt ihre alte Baseband-Infrastruktur durch eine IP-Umgebung nach SMPTE ST 2110. Integriert wurde das Projekt in rund sechs Monaten von BeckTV mit Grass Valley: zwei Kayenne-K-Frame-Switcher, LDX-Kameras, drei neue Regieräume und 100-GbE-Anbindung. Das Netz trägt HD bis 12G-UHD mit HDR, und Systeme von Grass Valley und Drittanbietern teilen sich dasselbe Netzwerk statt fester Baseband-Verbindungen.","warum":"Relevanz hoch: Ein Praxisbeispiel für den vollständigen Umstieg von SDI auf ST 2110, konkret übertragbar auf den Umbau einer Regie oder eines OB-Trucks, bei dem Kamera, Switcher und Farbkorrektur flexibel über das Netz gesteuert werden.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/sports-production/huskervision-deploys-grass-valley-based-st-2110-production-facility","datum":"2026-10-14"},{"id":"bmg-media-command","kat":"broadcast","typ":"news","titel":"BMG Media Command: Private Cloud für Aufnahme, MAM, Playout und Archiv","kurz":"Broadcast Management Group bündelt Aufnahme, Medienverwaltung, Playout, Archiv und Compliance in einer Plattform, die BMG als Managed Service aus der eigenen Leitstelle betreibt. Technisch basiert sie auf dem offenen TAMS-Standard (Time Addressable Media Store, ursprünglich BBC R&D), bei dem Medien als kurze Segmente referenziert statt kopiert werden. Eingespeist wird über ST 2110, SRT, RTMP, JPEG XS und SDI; Plug-ins für Premiere und DaVinci Resolve erlauben das Schneiden, während noch aufgenommen wird.","warum":"Relevanz hoch: Zeigt, wie sich Ingest, Schnitt und Playout über offene APIs automatisieren lassen; ein konkretes Anwendungsgebiet wären Near-Live-Highlights aus einem laufenden Event, die der Editor direkt aus dem Aufnahmestrom zieht.","quelle":"TV Technology","url":"https://www.tvtechnology.com/infrastructure/cloud/bmg-unveils-media-command","datum":"2026-10-15"},{"id":"tndv-remi-boxing","kat":"broadcast","typ":"news","titel":"REMI im Praxiseinsatz: Team Boxing League produziert aus einem Truck in Texas","kurz":"TNDV und GameTime Productions haben die vierte Saison der Team Boxing League vollständig fernproduziert: Regie, Programmausgabe und Distribution liefen aus einem Truck in Irving, Texas, während lokale Crews an wechselnden Austragungsorten sechs Kameras bedienten. Die Signale kamen per SRT über das öffentliche Internet mit rund 10 Mbit/s pro Kamera, als Rückfall diente Mobilfunk-Bonding von LiveU. Für die Kommunikation kam Unity Intercom zum Einsatz.","warum":"Relevanz hoch: Ein belastbares Muster für Remote-Produktion mit kleinem Vor-Ort-Team, übertragbar auf Sport oder Events in Hallen, in die kein Übertragungswagen passt.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/sports-production/tndv-gametime-productions-expand-remis-role-with-team-boxing-league","datum":"2026-10-15"},{"id":"cerberus-livelink-studio","kat":"broadcast","typ":"news","titel":"Cerberus Tech zeigt Livelink Studio: Live-Produktion in der Cloud nach Bedarf","kurz":"Livelink Studio ist eine Produktions- und Master-Control-Umgebung in der Cloud, aufgebaut auf dem Matrox-ORIGIN-Framework. Sie lässt sich für ein Event starten, danach abschalten und später wieder hochfahren (Pay-as-you-go). Enthalten sind Switching, Audio-Mix, Grafik mit Lower Thirds und Tickern, Multiviewer, Aufnahme und Routing; NDI-Eingänge und SRT-Telemetrie werden unterstützt. Die Premiere läuft auf der NAB Show New York am Matrox-Stand 827.","warum":"Relevanz mittel bis hoch: Ein naheliegendes Einsatzgebiet ist Overflow- oder Notfall-Playout, bei dem ein zusätzlicher Produktionskanal nur für die Dauer eines Events hochgefahren wird.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/cerberus-tech-to-introduce-livelink-studio-at-2026-nab-show-new-york","datum":"2026-10-14"},{"id":"pliant-crewcom-flex","kat":"broadcast","typ":"news","titel":"Pliant CrewCom Flex: Intercom ohne zentrale Matrix auf ST-2110-Basis","kurz":"Pliant zeigt auf der NAB Show New York ein „frameless“ Intercom-System, bei dem jedes Bedienpanel seine eigene verteilte Matrix mitbringt und so keinen zentralen Hardware-Frame braucht. Es kombiniert drahtgebundene, drahtlose und virtuelle Kommunikation auf einem AES67- und ST-2110-Backbone und unterstützt ST 2022-7 für Redundanz. Dazu gehören ein browserbasiertes virtuelles Panel und ein Dante/AES67-Interface für bestehende CrewCom-Funkanlagen.","warum":"Relevanz hoch: Passt zu IP-Regien, weil Sprechverbindungen im selben Netz wie Video und Audio laufen; ein Anwendungsfall ist die Intercom-Anbindung von Remote-Mitarbeitenden über das virtuelle Panel.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/pliant-to-feature-crewcom-flex-at-2026-nab-show-new-york","datum":"2026-10-14"},{"id":"multidyne-silverback-kits","kat":"broadcast","typ":"news","titel":"MultiDyne bietet SilverBack-Faserkits für Sony VENICE, BURANO und Canon C400","kurz":"Die Kits bündeln das SilverBack-Fasersystem, die kompakte 1-HE-Basisstation SVB-1 sowie kameraspezifische Kabel und Halterungen. Sie sind für Sony VENICE, Sony BURANO und Canon EOS C400 gedacht und tragen Video, Audio, Steuerung und Rückkanäle über eine einzige Glasfaser. MultiDyne zeigt sie auf der NAB Show New York am Stand 856.","warum":"Relevanz mittel: Interessant für Live-Cinema-Produktionen mit Cine-Kameras, bei denen Kamerakontrolle und Rückbild über Faser statt mehrerer Kabel laufen sollen.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/multidyne-introduces-complete-silverback-fiber-camera-kits-for-live-cinema-production","datum":"2026-10-15"},{"id":"imagine-nab-ny-insight","kat":"broadcast","typ":"news","titel":"NAB New York: Imagine Communications im Exhibitor-Insight-Format","kurz":"TV Technology hat Imagine Communications in der Reihe „Exhibitor Insight“ zur NAB Show New York vorgestellt. Gelesen wurde nur die Überschrift, der Inhalt ist hier nicht wiedergegeben.","warum":"Relevanz offen: Imagine ist laut einer Meldung vom April seit zehn Jahren im ST-2110-Umfeld aktiv, was genau gezeigt wird, steht erst nach Lektüre des Beitrags fest.","quelle":"TV Technology","url":"https://www.tvtechnology.com/events/2026-nab-show-new-york-exhibitor-insight-imagine-communications","datum":"2026-10-16"},{"id":"unifi-network-11","kat":"broadcast","typ":"update","schlagzeile":true,"titel":"Ubiquiti stellt UniFi Network 11 vor: WiFi-WAN, SD-WAN-Failover und Zonen-Firewall","kurz":"Ubiquiti hat UniFi Network 11 vorgestellt. Neu sind ein überarbeitetes Telemetrie-Backend, mehr VLANs und einfachere Routing-Richtlinien, WiFi-WAN als Haupt- oder Ersatzzugang, SD-WAN-Richtlinien mit eigenen Failover-Regeln sowie Matter- und Thread-Geräte in der Topologie. Laut einem Test von DongKnows mit einem Release Candidate setzt das Update UniFi OS 6 voraus, setzt die bisherige Statistik-Historie zurück und stellt alle Standorte automatisch auf die Zonen-Firewall um. Gateways der Reihe USG werden nicht mehr unterstützt.","warum":"Relevanz hoch: Für ein Studionetz mit NDI- oder Dante-Verkehr sind Zonen-Firewall und Failover-Regeln die entscheidenden Punkte, zu Multicast und QoS äußert sich Ubiquiti im Ankündigungstext nicht.","quelle":"Ubiquiti Blog","url":"https://blog.ui.com/article/introducing-unifi-network-11","datum":"2026-10-12"},{"id":"appear-nab-ny-ip","kat":"broadcast","typ":"news","hintergrund":true,"titel":"Appear zeigt auf der NAB New York IP-Contribution mit SRT, JPEG XS und ST 2110","kurz":"Appear stellt am Stand 129 der NAB Show New York (21.–22. Oktober) vor, wie die Hardware X Platform und die Software VX zusammenspielen. VX verlängert Zuspielungen in die Cloud und kann Verarbeitung in Software übernehmen, die X Platform erledigt die latenzarme Verarbeitung vor Ort. Unterstützt werden SRT mit Hardwarebeschleunigung, JPEG XS und ST 2110, damit Sender von Satellit, Standleitungen und SDI wegkommen. Der Artikel nennt außerdem die Konzepte DMF und MXL sowie die für Juli 2027 geplante C-Band-Auktion als Treiber. Zu Automatisierung oder Orchestrierung steht dort nichts.","warum":"Relevanz mittel: Die Richtung IP-Zuspielung plus Cloud-Verlängerung ist klar, konkrete Funktionen und Preise gibt es erst auf der Messe.","quelle":"TV Technology","url":"https://www.tvtechnology.com/platform/broadcast/2026-nab-show-new-york-exhibitor-insight-appear","datum":"2026-10-06"},{"id":"corsair-bitfocus-beteiligung","kat":"broadcast","typ":"news","hintergrund":true,"titel":"Corsair beteiligt sich an Bitfocus, dem Hersteller von Companion","kurz":"Corsair hat nach eigener Mitteilung vom 31. Juli eine Minderheitsbeteiligung an Bitfocus übernommen, der Firma aus Oslo hinter der Open-Source-Steuerung Companion und der Profi-Variante Buttons. Die Partnerschaft besteht seit fast zehn Jahren und führte 2024 zum Stream Deck Studio. Geplant sind gemeinsame Entwicklung und gemeinsamer Vertrieb. Companion soll offen bleiben, die Stream-Deck-Produkte sollen stärker auf Broadcast, Live-Produktion und AV zielen.","warum":"Relevanz hoch: Wer Regie und Studio über Companion und Stream Deck steuert, bekommt einen Hersteller mit Kapital im Rücken und eine Hardware-Linie, die stärker auf Profis ausgerichtet wird.","quelle":"Corsair (Pressemitteilung)","url":"https://ir.corsair.com/news-releases/news-release-details/corsair-deepens-strategic-relationship-bitfocus-extending","datum":"2026-07-31"},{"id":"companion-5-0-5","kat":"broadcast","typ":"update","hintergrund":true,"titel":"Bitfocus Companion: Version 5.0.5 bleibt die aktuelle Fassung","kurz":"Keine neue Version in dieser Woche. Laut Release-Seite ist 5.0.5 vom 3. September die aktuelle Version. Sie behebt Fehler bei Variablen in Feedbacks und Presets, nicht aktualisierte ausgeblendete Elemente und einen Absturz in Texteingabefeldern. Die Vorgänger 5.0.4 und 5.0.3 korrigierten unter anderem das Laden von Modulen, den Grafikeditor und Probleme unter Docker und macOS.","warum":"Relevanz mittel: Reine Fehlerkorrekturen, aber wer Regie-Buttons mit Variablen und Feedbacks baut, sollte mindestens auf 5.0.5 sein.","quelle":"GitHub (Bitfocus)","url":"https://github.com/bitfocus/companion/releases","datum":"2026-09-03"},{"id":"wooden-camera-fx6","kat":"kamera","typ":"news","titel":"Wooden Camera veröffentlicht überarbeitetes Zubehörsystem für die Sony FX6","kurz":"Laut Überschrift bei TV Technology bringt Wooden Camera ein neu gestaltetes Zubehörsystem für die Sony FX6. Weitere Details wurden nicht gelesen.","warum":"Relevanz gering: Reines Rigging-Zubehör, nur interessant, wenn FX6-Kameras im Haus im Einsatz sind.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/live-production/wooden-camera-releases-redesigned-sony-fx6-accessory-system","datum":"2026-10-14"},{"id":"sony-ecm-w5","kat":"kamera","typ":"news","titel":"Sony ECM-W5: Funkmikrofon-System mit 32-Bit-Float-Aufnahme","kurz":"Sony hat das Funkmikrofon-System ECM-W5 angekündigt. Laut CineD-Überschrift wird es über den Multi-Interface-Schuh der Kamera angeschlossen und nimmt in 32-Bit-Float auf, zusätzlich gibt es eine 64-GB-Backup-Aufnahme und Timecode. Preis und Verfügbarkeit wurden nicht gelesen.","warum":"Relevanz mittel: Timecode und interne Backup-Aufnahme machen das System für Ein-Personen-Drehs und Interviews interessant, bei denen Ton später automatisch an das Bild synchronisiert werden soll.","quelle":"CineD","url":"https://www.cined.com/sony-ecm-w5-wireless-microphone-system-announced-32-bit-float-via-mi-shoe-64gb-backup-recording-timecode/","datum":"2026-10-15","datum_hinweis":"Ankündigung laut Photo-Rumors-Liste am 15.10.; CineD zeigt nur „vor 3 Tagen“."},{"id":"z-cam-e2-f6-fw","kat":"kamera","typ":"update","titel":"Z CAM E2-F6 Pro: Firmware 0.9.10 bringt interne ProRes RAW-Aufnahme","kurz":"Laut Überschrift erlaubt die Firmware 0.9.10 für die Z CAM E2-F6 Pro interne ProRes-RAW-Aufnahme bis 6K bei 60 Bildern pro Sekunde. Mehr als die Überschrift wurde nicht gelesen.","warum":"Relevanz gering bis mittel: Für Produktionen mit Z-CAM-Kameras ein sinnvoller Workflow-Gewinn, ein breiter Broadcast-Einsatz ist eher unwahrscheinlich.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/10/16/z-cam-e2-f6-pro-firmware-update-adds-prores-raw-internally-at-up-to-6k-60fps/","datum":"2026-10-16"},{"id":"osmo-pocket-4p-pearl-white","kat":"kamera","typ":"news","titel":"DJI Osmo Pocket 4P in Pearl White: Launch am 20. Oktober, ohne USA","kurz":"DJI kündigt für den 20. Oktober um 12 Uhr GMT die weiße Variante der Osmo Pocket 4P an. In China ist sie seit dem 16. September erhältlich, die schwarze 4P kam am 30. Juli weltweit ohne die USA auf den Markt. Einen Preis nennt der Teaser nicht.","warum":"Relevanz gering: Nur eine neue Farbe, kein technisches Update; höchstens als Fall für kleine B-Kameras oder Social-Clips interessant.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/15/dji-osmo-pocket-4p-pearl-white-october-20-launch/","datum":"2026-10-15"},{"id":"sigma-yamaki-interview","kat":"kamera","typ":"news","titel":"Sigma-Chef Yamaki im IBC-Interview: 85 mm f/1.2 Art, 20-60 mm f/2.8-4 und Aizu-Festbrennweiten","kurz":"Laut Anreißer bei Sony Addict spricht Sigma-CEO Kazuto Yamaki über das neue 85 mm f/1.2 Art, das 20-60 mm f/2.8-4 Contemporary, die Aizu-Festbrennweiten, Filter sowie KI und Robotik. Der Interviewtext selbst wurde nicht gelesen.","warum":"Relevanz gering bis mittel: Interessant wegen der Hinweise auf Sigmas Richtung (Optik plus KI), konkrete Produktdaten fehlen noch.","quelle":"Sony Addict","url":"https://sonyaddict.com/2026/10/18/ibc-2026-sigma-ceo-kazuto-yamaki-on-the-new-85mm-f-1-2-art-20-60mm-f-2-8-4-contemporary-aizu-primes-filters-ai-and-robotics/","datum":"2026-10-18"},{"id":"canon-patent-high-index","kat":"kamera","typ":"geruecht","sicherheit":1,"titel":"Canon-Patent: Hochbrechendes Glas könnte RF 100 mm f/1.4 und RF-S 65 mm f/1.4 verkleinern","kurz":"Ein Canon-Patent (JP 2026-167867) beschreibt Hochindex-Glas, mit dem sich die Festbrennweiten RF 100 mm f/1.4 und RF-S 65 mm f/1.4 kleiner bauen ließen. Ein Patent sagt nichts darüber, ob und wann daraus Produkte entstehen.","warum":"Relevanz gering: Reine Spekulation ohne Produktbezug, für den Broadcast-Alltag derzeit ohne Folgen.","quelle":"Canon Addict","url":"https://canonaddict.com/2026/10/17/canon-patent-jp-2026-167867-revolutionary-high-index-glass-aims-to-shrink-rf-100mm-f-1-4-rf-s-65mm-f-1-4-aps-c-primes/","datum":"2026-10-17"},{"id":"dji-dock-4-matrice-5td","kat":"drohnen","typ":"news","schlagzeile":true,"titel":"DJI Dock 4 und Matrice 5TD: erste Dockingstation mit automatischem Akkuwechsel","kurz":"DJI hat am 14. Oktober die Dock 4 samt Matrice 5TD vorgestellt. Der Akkuwechsel dauert laut DJI 25 Sekunden, von der Landung bis zum nächsten Start vergehen 45 Sekunden. Die Station hält drei Ersatzakkus und lädt bis zu zwei gleichzeitig. Die Drohne fliegt bis zu 59 Minuten und trägt drei 50-Megapixel-Kameras, eine Wärmebildkamera, Lidar und Millimeterwellenradar. In den USA ist sie wegen der Covered List nicht verkäuflich.","warum":"Relevanz mittel: Vollautomatische Drohnen-in-der-Box-Systeme passen zum Automatisierungsgedanken, ein Anwendungsgebiet wären wiederkehrende Luftaufnahmen oder Inspektionen von Sendeanlagen und Gelände ohne Pilot vor Ort.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/16/fcc-chinese-test-labs-dronesense-laanc-dji-dock-4-matrice-5td/","datum":"2026-10-16"},{"id":"adobe-nvidia-partnerschaft","kat":"schnitt","typ":"news","schlagzeile":true,"titel":"Adobe und NVIDIA vertiefen KI-Partnerschaft: Premiere und Frame.io schneller","kurz":"Adobe optimiert Photoshop, Premiere und Substance 3D für NVIDIAs neuen RTX-Spark-Chip und nennt bis zu doppelt so schnelle KI-Verarbeitung, Bearbeitung, Farbe und Effekte. In Premiere sollen unter anderem Wiedergabe, Rendering, Sprachverbesserung und Objektmaske profitieren. In Frame.io übernehmen NVIDIA-GPUs Decoding und Suchvorbereitung; erste Tests zeigen etwa fünffach schnelleres Erzeugen von Embeddings. Vorgeführt werden soll das auf der Adobe MAX im November.","warum":"Relevanz mittel: Schnellere GPU-Verarbeitung verkürzt Nachbearbeitung, und die Frame.io-Suche per Embeddings ist ein Ansatz für automatisches Auffinden von Szenen in großen Medienarchiven.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/adobe-nvidia-expand-their-ai-partnership","datum":"2026-10-15"},{"id":"resolve-21-1-mcp","kat":"schnitt","typ":"update","hintergrund":true,"titel":"DaVinci Resolve 21.1: MCP-Server und KI-Assistenten-Anbindung","kurz":"Keine neue Version in dieser Woche, aber ein Blick auf 21.1 vom 7. September lohnt für die Automatisierung: Das Update bringt eine KI-Assistenten-Integration, einen nativen MCP-Server und eine Python-Konsole. Neue API-Aufrufe richten Clips auf der Timeline automatisch aus, normalisieren Audio und liefern Transkriptionen mit Sprecher und Timing. Erweiterte Skripte erfordern die Studio-Version.","warum":"Relevanz hoch: Der MCP-Server und die Python-API erlauben automatisierte Schnittschritte, etwa einen Batch, der Interviews synchronisiert, den Pegel normalisiert und ein Transkript für den Rohschnitt erzeugt.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/09/07/blackmagic-design-davinci-resolve-21-1/","datum":"2026-09-07"},{"id":"enco-encue-spotai","kat":"ki","typ":"news","titel":"ENCO bringt enCue und SPOTai für Newsrooms nach Nordamerika","kurz":"enCue ist ein browserbasiertes Cloud-Tool, das in langen Sendungen Schlüsselmomente findet und daraus Social-Clips mit Titeln, Untertiteln und Hochformat-Umsetzung sowie 15-Sekunden-Teaser erzeugt. Es kann auch Skript oder Sprechertext mit Rohmaterial abgleichen und fertige Beiträge für den Editor vorbereiten. SPOTai erzeugt aus Markeninfos und Text-Prompt Werbespots in 1080p. Beide debütieren auf der NAB Show New York an Stand 539.","warum":"Relevanz hoch: Automatisches Clip-Farming aus Livesendungen ist ein direkter Hebel für Newsrooms, ein Anwendungsgebiet wäre die Social-Aufbereitung einer Live-Sendung noch während der Ausstrahlung.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/enco-highlights-ai-tools-for-newsrooms-local-ads-at-nab-show-new-york","datum":"2026-10-15"},{"id":"elevenlabs-hoerbuch","kat":"ki","typ":"news","titel":"Mehrstimmige Hörbücher: menschliche Sprecher oder geklonte ElevenLabs-Stimmen","kurz":"ProVideo Coalition widmet sich Hörbüchern mit mehreren Stimmen für Dialoge, entweder mit menschlichen Schauspielern oder mit per ElevenLabs geklonten Stimmen. Gelesen wurde nur die Überschrift, Ergebnisse oder Bewertung sind daher nicht wiedergegeben.","warum":"Relevanz gering bis mittel: Synthetische Stimmen sind ein denkbarer Baustein für automatisierte Ansagen oder Mehrsprachigkeit, rechtliche und redaktionelle Fragen bleiben offen.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/audiobooks-with-multiple-voices-for-dialog-using-human-actors-or-cloned-with-elevenlabs/","datum":"2026-10-14"},{"id":"artcraft-adobe-klone","kat":"ki","typ":"news","schlagzeile":true,"titel":"ArtCraft: Entwickler baut mit Claude und Rust freie Nachbauten von Adobe-Programmen","kurz":"Der Entwickler Brandon Thomas aus Atlanta hat mit Claude und der Sprache Rust das Open-Source-Projekt ArtCraft gebaut. Dazu gehören PhotoCraft (Photoshop-artig), FilmCraft (Premiere-artig), LightCraft (Lightroom-artig) und weitere Programme, später kamen laut Al Jazeera auch Office-Gegenstücke hinzu. Er beruft sich auf einen Clean-Room-Ansatz aus öffentlichen Dateiformat-Spezifikationen, ein Rechtsprofessor hält offen, ob das trägt. Gizmodo beschreibt die Programme als frühe Alpha-Software, PhotoCraft sei für einfache Compositings brauchbar, aber nicht stabil.","warum":"Relevanz mittel: Zeigt, wie schnell sich mit KI-Agenten Programmfunktionen nachbauen lassen, für Produktionsarbeit taugt es nach Aussage des Entwicklers noch nicht.","quelle":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/14/how-ai-apps-are-offering-free-substitutes-for-big-tech-software","datum":"2026-10-14"},{"id":"resolve-21-1-mcp-grenzen","kat":"ki","typ":"news","hintergrund":true,"titel":"Resolve 21.1 und MCP: Nur in Studio, Sicherheitsfragen noch offen","kurz":"Der native MCP-Server steckt in DaVinci Resolve Studio 21.1 vom 8. September, nicht in der kostenlosen Version. Unterstützt werden Claude, Claude Code und ChatGPT Codex, die Verbindung wird über das Datei-Menü eingerichtet. Blackmagic nennt als Beispiel einen Highlight-Schnitt von drei Minuten mit Entfernen kurzer Segmente und H.265-Render. Digital Production bemängelt, dass Berechtigungen, Schutz vor zerstörenden Aktionen und Protokollierung nicht erklärt sind. Projekte aus 21.1 lassen sich in Resolve 20.3 nicht öffnen.","warum":"Relevanz hoch: Vor dem Einsatz an echten Projekten gilt: Backup anlegen und Aufträge eng fassen, bis klar ist, was der Assistent ändern darf.","quelle":"Digital Production","url":"https://digitalproduction.com/2026/09/08/resolve-21-1-adds-mcp-and-finally-gets-presets/","datum":"2026-09-08"},{"id":"claude-creative-connectors","kat":"ki","typ":"news","hintergrund":true,"titel":"Anthropic bindet Claude an Adobe, Blender, Affinity und weitere Kreativprogramme an","kurz":"Nach Angaben von Anthropic vom 28. April gibt es Konnektoren für Adobe (mehr als 50 Werkzeuge in Creative Cloud, darunter Photoshop, Premiere und Express), Blender, Affinity, Autodesk Fusion, Resolume, SketchUp, Ableton und Splice. Der Blender-Konnektor baut ausdrücklich auf MCP auf und gibt per Sprache Zugriff auf die Python-API. Für die anderen Konnektoren nennt die Seite MCP nicht. Lightroom und DaVinci Resolve stehen nicht in der Liste, welche Tarife die Konnektoren enthalten, ist dort nicht angegeben. Das sind Herstellerangaben.","warum":"Relevanz hoch: Der Trend geht von Skripten zur Steuerung per Chat, Resolve hat dafür einen eigenen MCP-Server und Lightroom bislang nur Adobes eigene Prompt-Funktion.","quelle":"Anthropic","url":"https://www.anthropic.com/news/claude-for-creative-work","datum":"2026-04-28"},{"id":"instax-square-2","kat":"foto","typ":"news","titel":"Fujifilm kündigt Instax SQUARE 2 und den Film „Soft Haze“ an","kurz":"Fujifilm hat laut Photo-Rumors-Liste eine neue Sofortbildkamera Instax SQUARE 2 zusammen mit einer Filmvariante „Soft Haze“ vorgestellt. Weitere Details wurden nicht gelesen.","warum":"Relevanz gering: Consumer-Produkt ohne Bezug zu Broadcast oder Automatisierung.","quelle":"Fuji Addict","url":"https://fujiaddict.com/2026/10/14/instax-square-2-and-soft-haze-film-announced/","datum":"2026-10-14"},{"id":"gfx100rf-interview","kat":"foto","typ":"news","titel":"Fujifilm GFX100RF: Interview zur Entstehung der 100-MP-Mittelformatkamera","kurz":"Laut Anreißer erklärt ein Interview, wie die 100-Megapixel-Mittelformatkamera GFX100RF bei Fujifilm entwickelt wurde. Der Interviewtext selbst wurde nicht gelesen.","warum":"Relevanz gering: Hintergrundlektüre für Fotografie, ohne direkten Nutzen für Broadcast.","quelle":"Fuji Addict","url":"https://fujiaddict.com/2026/10/18/pp-fujifilm-gfx100rf-interview-inside-fujifilm-how-the-100mp-gfx100rf-medium-format-camera-is-made/","datum":"2026-10-18"},{"id":"lightroom-prompt-to-edit","kat":"foto","typ":"update","hintergrund":true,"titel":"Lightroom: „Prompt to Edit“ und Reflexionsentfernung im September-Update","kurz":"Keine neue Version in dieser Woche. Das letzte Lightroom-Desktop-Update führt „Prompt to Edit“ ein, bei dem man die gewünschte Bearbeitung beschreibt, etwa Retusche oder Restaurierung. Es nutzt das Modell Nano Banana. Dazu kommt eine Funktion, die Reflexionen auf Glas, Wasser und Fenstern entfernt, sowie Unterstützung für neue Kameras und Objektive.","warum":"Relevanz gering bis mittel: Sprachgesteuerte Bildbearbeitung ist ein Vorgeschmack auf KI-Bedienung auch im Videobereich, etwa für schnelle Korrekturen an Standbildern und Thumbnails.","quelle":"Adobe Hilfe","url":"https://helpx.adobe.com/lightroom/desktop/introduction/release-notes.html","datum":null,"datum_hinweis":"September-2026-Update, Seite zuletzt am 29.09. aktualisiert."}],"key":"2026-KW43"},{"jahr":2026,"kw":44,"von":"2026-10-20","bis":"2026-10-25","stand":"2026-10-26","intro":"Die Woche nach der NAB Show New York bringt viel IP- und Automatisierungsstoff: Bridge schliesst sich der offenen MXL-Schicht an, Blackmagic verbessert NMOS und ST 2110 in der Kamera, und Bitfocus Companion 5.1 bekommt eine REST-API. Dazu kommen die Sigma fp II mit 6K Open Gate und ProRes RAW, eine Firmware-Welle bei DJI und ein KI-Werkzeug für Wetterredaktionen.","hinweis":"Jede Meldung enthält eine kurze Einschätzung für eine Broadcast-Firma mit Fokus auf Automatisierung und IP-Technik (Relevanz und konkretes Einsatzgebiet). Mehrere Quellen (u. a. CineD, Sony Alpha Rumors, Canon Rumors, Adobe-Blog) waren im automatischen Lauf nicht oder nur über Suchergebnisse erreichbar, Meldungen mit nur gelesener Überschrift sind knapp gehalten. Zu Adobe Creative Cloud und Gyroflow gab es keine neue Version im Berichtszeitraum. Der Bitfocus-Eintrag stützt sich auf die GitHub-Seiten, auf denen das Jahr nicht angezeigt wird.","termine":[{"datum":"2026-10-29","text":"FCC-Abstimmung über chinesische Prüflabore"},{"datum":"2026-10-31","text":"DJI beendet den Support der Phantom 4 Pro V2"},{"datum":"2026-11-01","label":"Nov.","text":"Fujifilm X-T6 und XF 50-140 mm f/2.8 II erwartet","geruecht":true},{"datum":"2026-11-05","text":"Nikon Quartalszahlen (Q2 GJ 2027)"},{"datum":"2026-11-10","label":"10.–12.11.","text":"Adobe MAX, Miami Beach (auch online)"},{"datum":"2026-11-18","text":"China: Exportlizenzpflicht für grosse Drohnenmotoren, Regler und Propeller"},{"datum":"2027-09-28","label":"28.–30.9.2027","text":"SMPTE-Summit und NAB Show New York (29.–30.9.), Javits Center"}],"items":[{"id":"mxl-bridge-grassvalley","kat":"broadcast","typ":"news","titel":"Bridge Technologies tritt MXL bei: Monitoring-Scopes laufen als Container in Grass Valley AMPP","kurz":"Bridge Technologies hat sich am 22. Oktober der MXL-Initiative angeschlossen. MXL ist eine offene Schicht für IP-native, softwaredefinierte Produktion, an der unter anderem EBU und Linux Foundation beteiligt sind. Bridges Video- und Audio-Scopes laufen als Container ohne Spezialhardware und lassen sich in AMPP bei Bedarf zuschalten, etwa bei grossen Live-Events.","warum":"Relevanz hoch: offene Schnittstellen und Container-Monitoring sind der Weg zu hardwareunabhängiger IP-Produktion – Einsatz: Signalkontrolle in einem Software-Studio-Stack, der sich per Skript oder Companion starten lässt.","quelle":"TV Technology","url":"https://www.tvtechnology.com/business/partnerships/bridge-building-mxl-links-with-grass-valley-ampp-integration","datum":"2026-10-22","schlagzeile":true},{"id":"blackmagic-camera-10-3-2","kat":"broadcast","typ":"update","titel":"Blackmagic Camera 10.3.2 für URSA Cine 12K LF: NMOS-Steuerung und ST-2110-Umschaltung verbessert","kurz":"Das Update für die URSA Cine 12K LF verbessert die REST-Steuerung von NMOS am 10G-Port und das Umschalten zwischen SMPTE 2110 und Blackmagic RAW. Dazu kommt ein besseres Verhalten der LUT-Symbole. Konkrete Fehlerlisten nennt der Bericht nicht.","warum":"Relevanz hoch: eine Kamera, die sich per NMOS im IP-Netz anmelden und steuern lässt, passt direkt zu automatisierten Studios – Einsatz: Kameraanbindung an ein NMOS-Registry und Steuerung per API statt per Hand.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/10/20/blackmagic-camera-10-3-2-update/","datum":"2026-10-20","schlagzeile":true},{"id":"clear-com-mentrix","kat":"broadcast","typ":"news","titel":"Clear-Com stellt Mentrix-Panel vor: Touch, PoE und Audio over IP","kurz":"Das Intercom-Panel hat 16 Tastenfelder aus acht Hebeltasten und acht oder 16 Drehtasten, dazu Touchbedienung, ein dynamisches Display, USB und Stromversorgung per PoE. Es ist VESA-kompatibel und für IP-basierte Produktionsumgebungen gedacht. ST 2110 oder Dante nennt der Bericht nicht.","warum":"Relevanz mittel: Intercom über das normale Netzwerk spart Verkabelung – Einsatz: Regie-Kommunikation in Studio oder Ü-Wagen mit PoE-Switch, ohne extra Netzteile.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/clear-com-unveils-mentrix-panel-at-nab-show-new-york","datum":"2026-10-21"},{"id":"cbc-dalet-pyramid","kat":"broadcast","typ":"news","titel":"CBC/Radio-Canada führt Dalet Pyramid für die gesamte Nachrichtenproduktion ein","kurz":"Die Plattform arbeitet story-zentriert und im Browser, sodass Tausende Nutzer gleichzeitig an verschiedenen Standorten und im Feld arbeiten können. Dalet Brio übernimmt Aufnahme und Ingest, Dalet Cut den Schnitt. Betrieb ist lokal, in der Cloud oder hybrid möglich.","warum":"Relevanz mittel: zeigt, wie grosse Sender Ingest, Schnitt und Verteilung in einer Oberfläche bündeln – Einsatz: Vorbild für einen automatisierten News-Workflow mit Ingest-Regeln und Browser-Schnitt.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/live-production/cbc-radio-canada-taps-dalet-to-modernize-news-operations","datum":"2026-10-22"},{"id":"smpte-nab-ny-2027","kat":"broadcast","typ":"news","titel":"SMPTE-Summit zieht 2027 zur NAB Show New York; NAB NY 2026 mit rund 6 700 Besuchern","kurz":"Der SMPTE-Summit findet ab 2027 am Javits Center parallel zur NAB Show New York statt, geplant vom 28. bis 30. September, die Messe selbst am 29. und 30. September. Die diesjährige NAB New York zählte laut Bericht rund 6 700 Besucher nach 11 500 im Vorjahr, mit etwa 250 Ausstellern.","warum":"Relevanz mittel: SMPTE und NAB am selben Ort bündeln Normung und Produkte – Einsatz: Terminplanung für Weiterbildung zu ST 2110 und IPMX an einem Ort.","quelle":"TV Technology","url":"https://www.tvtechnology.com/events/smpte-to-hold-its-annual-tech-summit-in-conjunction-with-nab-show-new-york-starting-in-2027","datum":"2026-10-23"},{"id":"fox-world-series-technik","kat":"broadcast","typ":"news","titel":"Fox rüstet die World Series mit 4K-Nucleus-Kameras, AR und zwei Drohnen auf","kurz":"Neu sind drei 4K-Nucleus-Kameras und ein erweiterter AR-Einsatz, der mit MLB-Daten 18 Feeds nutzt. Hinzu kommen elf Zeitlupenkameras, zwei Drohnen, 27 Sony-Kameras der 5500-Serie, acht Robotik-Köpfe und etwa 70 Mikrofone.","warum":"Relevanz niedrig bis mittel: ein Blick auf die Grössenordnung einer Grossproduktion – Einsatz: Ideen für Robotik-Köpfe und datengetriebene Grafiken in kleineren Sportübertragungen.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/sports-production/fox-sports-to-add-4k-8k-nucleus-cameras-to-world-series-production-tech-lineup","datum":"2026-10-23"},{"id":"becktv-beam-providius","kat":"broadcast","typ":"news","titel":"BeckTV, Beam Dynamics und Providius kooperieren bei Systemdesign, Asset-Analyse und Live-Monitoring","kurz":"Gelesen wurde nur die Überschrift: Drei Firmen arbeiten bei Broadcast-Systemdesign, Asset-Intelligenz und Live-Überwachung zusammen. Details liegen nicht vor.","warum":"Relevanz niedrig: Details fehlen – Einsatz: erst bewerten, wenn Produktinfos zu Monitoring und Asset-Analyse vorliegen.","quelle":"TV Technology","url":"https://www.tvtechnology.com/business/partnerships/becktv-beam-dynamics-and-providius-partner-on-broadcast-system-design-asset-intelligence-and-live-monitoring","datum":"2026-10-21"},{"id":"companion-5-1","kat":"broadcast","typ":"update","titel":"Bitfocus Companion 5.1: REST-API-Prototyp, lokale Seiten-Variablen und Prometheus-Metriken; 5.1.1 folgt am 21. Oktober","kurz":"Version 5.1.0 vom 11. Oktober bringt einen Prototyp einer vollständigen System-REST-API, Token-Verwaltung, Variablen auf Seitenebene, neue Mathefunktionen und Prometheus-Metriken. Auch die Grafik-Werkzeuge wachsen, etwa mit Symbolleiste für Tastenstile. Das Update 5.1.1 vom 21. Oktober enthält nur Fehlerkorrekturen bei Ausdrücken, Variablen und Emulator.","warum":"Relevanz hoch: API und Metriken machen Companion zum steuerbaren, überwachbaren Baustein – Einsatz: Tasten per Skript oder Claude anlegen und den Zustand der Regie in Grafana überwachen.","quelle":"GitHub (Bitfocus)","url":"https://github.com/bitfocus/companion/releases/tag/v5.1.0","datum":"2026-10-11","schlagzeile":true},{"id":"sigma-fp-ii","kat":"kamera","typ":"news","titel":"Sigma fp II: 24-MP-Vollformat mit 6K Open Gate, ProRes RAW und HDMI in voller Grösse","kurz":"Die modulare Kompaktkamera hat einen teilweise gestapelten 24-MP-Sensor, bis zu 20 Bilder pro Sekunde und im CINE-Modus 6K Open Gate, ProRes RAW und L-Log. Dazu gibt es einen 3,15-Zoll-Kippmonitor, zwei USB-C-Anschlüsse und 70 GB internen Speicher. Parallel erschien ein 50 mm f/1.4 CL DG Contemporary. Vorbestellungen laufen, einen Preis nennt der Bericht nicht.","warum":"Relevanz mittel: kleine Kamera mit RAW und vollem HDMI – Einsatz: Zweitkamera oder ferngesteuerte Kamera im Studio, per HDMI in ein NDI-Gateway.","quelle":"Photo Rumors","url":"https://photorumors.com/2026/10/23/announced-sigma-fp-ii-camera-50mm-f-1-4-cl-dg-contemporary-lens-and-new-accessories/","datum":"2026-10-23","schlagzeile":true},{"id":"thypoch-simera-c-100","kat":"kamera","typ":"news","titel":"Thypoch Simera-C 100 mm T1.9: letztes Objektiv der Cine-Serie, ab 879 US-Dollar","kurz":"Der siebte und letzte Vollformat-Cine-Prime der Serie hat T1.9, 16 Blendenlamellen und 0,85 m Naheinstellgrenze. Er erscheint für Sony E und Leica M und kostet 879 US-Dollar (E) beziehungsweise 959 US-Dollar (M). Die Auslieferung soll Ende Oktober beginnen.","warum":"Relevanz niedrig: günstige Cine-Optik – Einsatz: Look-Objektiv für Interviews oder Imagefilme an einer E-Mount-Kamera.","quelle":"Photo Rumors","url":"https://photorumors.com/2026/10/24/thypoch-simera-c-100mm-t1-9-lens-for-sony-e-leica-m-mount-announced/","datum":"2026-10-24"},{"id":"osmo-pocket-4p-firmware","kat":"kamera","typ":"news","titel":"Osmo Pocket 4P: Launch-Video nennt ActiveTrack 9.0 und 18-fach-Zoom, die Pressemitteilung 8.0 und 12-fach","kurz":"DJI hat die Pearl-White-Version verkauft, das UK-Standardpaket kostet 529 Pfund. Das Launch-Video verweist auf die Firmware 01.02.12.01 mit ActiveTrack 9.0 und 18-fach-Zoom, die Pressemitteilung dagegen auf 8.0 und 12-fach. Öffentliche Versionshinweise gibt es laut Bericht noch nicht, in den USA ist das Gerät nicht erhältlich.","warum":"Relevanz niedrig bis mittel: automatische Motivverfolgung vereinfacht Aufnahmen – Einsatz: unbemannte Zusatzperspektive bei Interviews oder Events.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/20/dji-osmo-pocket-4p-pearl-white-on-sale-activetrack-9-firmware","datum":"2026-10-20"},{"id":"fuji-x-t6-geruecht","kat":"kamera","typ":"geruecht","titel":"Gerücht: Fujifilm X-T6 mit 40 MP, 8K/30p und ProRes RAW, Start im November","kurz":"Photo Rumors fasst unbenannte Berichte zusammen: Die Ankündigung rutscht von September auf November, zusammen mit einem XF 50-140 mm f/2.8 II. Genannt werden 40 MP, X-Processor 6, 8K/30p 10 Bit, 4K/120p, 12-Bit-ProRes sowie Blackmagic-RAW-Ausgabe, ein grösserer Akku und Preise um 1 999 bis 2 199 Euro. Die Berichte widersprechen sich bei der Beweglichkeit des Monitors.","warum":"Relevanz niedrig: Fotokamera mit starken Videofunktionen – Einsatz: kompakte B-Kamera mit RAW-Ausgabe, falls das Gerücht stimmt.","quelle":"Photo Rumors","url":"https://photorumors.com/2026/10/22/upcoming-fujifilm-announcements-x-t6-camera-and-xf-50-140mm-f-2-8-ii-lens/","datum":"2026-10-22","sicherheit":1},{"id":"insta360-ace-pro-3-fcc","kat":"kamera","typ":"geruecht","titel":"Gerücht: Insta360 Ace Pro 3 taucht bei der FCC auf","kurz":"Laut Photo-Rumors-Überschrift wurde eine Insta360 Ace Pro 3 bei der FCC zur Prüfung registriert, ein üblicher Schritt vor dem Marktstart. Mehr ist aus der verfügbaren Überschrift nicht ableitbar.","warum":"Relevanz niedrig: Action-Kamera – Einsatz: Zweitperspektive, sobald Daten vorliegen.","quelle":"Photo Rumors","url":"https://photorumors.com/2026/10/21/the-next-insta360-ace-pro-3-camera-lands-at-the-fcc/","datum":"2026-10-21","sicherheit":2},{"id":"primetime-duo-stream","kat":"licht","typ":"news","titel":"PrimeTime Lighting: Duo Stream, Beleuchtung mit Strom und Daten über ein Kabel","kurz":"Kompatible Leuchten werden in Reihe verkettet, Strom und Steuerung laufen über eine einzige Leitung, je nach Aufbau bis zu 28 Lampen. Das System hat hohe CRI- und TLCI-Werte und einen Abstrahlwinkel von 60 bis 80 Grad. Es richtet sich an Podcaster, kleine Studios und Schulen und wird in den USA gefertigt.","warum":"Relevanz mittel: vereinfachte Verkabelung für Studiolicht – Einsatz: fest verbautes Licht in einem kleinen Studio, das sich später in eine Steuerungsebene einbinden
