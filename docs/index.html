<style>
/* Layout: Regiepult. Kopfzeile mit Farbbalken, der zugleich als Themenfilter dient,
   links die aufklappbaren Meldungen, rechts Schlagzeilen und Termine als Ablaufplan. */
:root {
  --bg: #E8EDEE;
  --surface: #F5F8F8;
  --ink: #10171A;
  --ink2: #46555C;
  --line: #C5CFD3;
  --accent: #D93A22;
  --accent-ink: #FFFFFF;
  --c-broadcast: #3566D0;
  --c-kamera: #C99700;
  --c-licht: #0E8FA8;
  --c-drohnen: #1C9B72;
  --c-schnitt: #B8379A;
  --c-foto: #7255D0;
  --c-ki: #DB6A14;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1316;
    --surface: #151D21;
    --ink: #E6ECEE;
    --ink2: #9BA9AF;
    --line: #28343A;
    --accent: #FF5B45;
    --accent-ink: #10171A;
    --c-broadcast: #6C98F2;
    --c-kamera: #F0C23A;
    --c-licht: #4CC9E0;
    --c-drohnen: #3ECF9D;
    --c-schnitt: #E36DC5;
    --c-foto: #A18CF2;
    --c-ki: #F4954A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1316;
  --surface: #151D21;
  --ink: #E6ECEE;
  --ink2: #9BA9AF;
  --line: #28343A;
  --accent: #FF5B45;
  --accent-ink: #10171A;
  --c-broadcast: #6C98F2;
  --c-kamera: #F0C23A;
  --c-licht: #4CC9E0;
  --c-drohnen: #3ECF9D;
  --c-schnitt: #E36DC5;
  --c-foto: #A18CF2;
  --c-ki: #F4954A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Kopf */
.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.brand { min-width: 0; }
.brand h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(34px, 7vw, 54px);
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  text-wrap: balance;
}
.brand h1 span { font-weight: 500; color: var(--ink2); }
.edmeta { margin: 8px 0 0; font-family: var(--f-mono); font-size: 12.5px; color: var(--ink2); letter-spacing: 0.02em; }
.edpick { display: flex; flex-direction: column; gap: 4px; }
.edpick label, .lbl {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink2);
}
select {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 7px 10px;
  min-width: 220px;
  max-width: 100%;
}

.bar { display: flex; gap: 2px; height: 14px; margin-top: 16px; }
.bar button {
  flex-grow: 1;
  flex-basis: 0;
  min-width: 6px;
  border: 0;
  padding: 0;
  border-radius: 1px;
  transition: opacity .15s;
}
.bar.filtered button:not([aria-pressed="true"]) { opacity: .22; }

.intro { max-width: 70ch; margin: 22px 0 0; font-size: 16.5px; line-height: 1.6; text-wrap: pretty; }
.intro.start { color: var(--ink2); font-size: 13.5px; margin-top: 6px; }

/* Raster */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; margin-top: 26px; }
@media (min-width: 900px) {
  .grid { grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; align-items: start; }
  .rail { order: 2; }
  .main { order: 1; }
}
.rail { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.main { min-width: 0; }
@media (max-width: 899px) { .rail { order: 1; } .main { order: 2; } }

h2.sec {
  margin: 0 0 10px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Schlagzeilen */
.top { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.top li { border-bottom: 1px solid var(--line); }
.top button {
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr);
  gap: 10px;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 10px 2px;
}
.top button:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.top .tt { font-weight: 600; line-height: 1.35; }
.top .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--cc, var(--c-schnitt)); flex: none; }

/* Termine */
.rundown { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.rundown li { display: grid; grid-template-columns: 6.2ch minmax(0, 1fr); gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.rundown .tc { font-family: var(--f-mono); font-size: 12.5px; font-weight: 500; padding-top: 1px; font-variant-numeric: tabular-nums; }
.rundown .tx { min-width: 0; }
.rundown .tag {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  font-family: var(--f-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid var(--ink2);
  border-radius: 3px;
  color: var(--ink2);
  vertical-align: 1px;
}
.rundown .heute .tc { color: var(--accent); }
.rundown .past { opacity: .5; }

/* Steuerung */
.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 14px; }
.search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 9px 12px;
}
.search::placeholder { color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 11px 4px 9px;
  font-size: 13.5px;
}
.chip .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chip[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 5px 11px; font-size: 13.5px; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; cursor: pointer; }
.chk input { width: 16px; height: 16px; accent-color: var(--ink); margin: 0; }
.linkbtn { background: none; border: 0; padding: 4px 2px; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink2); }
.linkbtn:hover { color: var(--ink); }
.count { margin: 0 0 4px; font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }

/* Meldungen */
.group { margin-top: 22px; }
.group:first-of-type { margin-top: 8px; }
.ghead { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; padding-bottom: 6px; border-bottom: 2px solid var(--cc, var(--ink)); }
.ghead h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.ghead .gn { font-family: var(--f-mono); font-size: 12px; color: var(--ink2); }
.flat { margin-top: 8px; border-top: 2px solid var(--ink); }

details.item { border-bottom: 1px solid var(--line); }
details.item > summary {
  list-style: none;
  display: grid;
  grid-template-columns: 10px minmax(0, 1fr) 14px;
  gap: 12px;
  align-items: start;
  padding: 11px 2px;
  cursor: pointer;
}
details.item > summary::-webkit-details-marker { display: none; }
details.item > summary:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.t { display: block; font-weight: 600; line-height: 1.38; text-wrap: pretty; }
.item.read .t { font-weight: 500; color: var(--ink2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 4px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.badge {
  display: inline-block;
  padding: 0 6px;
  border: 1px solid currentColor;
  border-radius: 3px;
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  line-height: 17px;
}
.badge.geruecht { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.neu { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.item.read .neu { display: none; }
.meter { display: inline-flex; align-items: center; gap: 3px; }
.meter i { width: 9px; height: 9px; border: 1px solid var(--ink); background: transparent; }
.meter i.on { background: var(--ink); }
.chev { width: 8px; height: 8px; margin-top: 8px; border-right: 2px solid var(--ink2); border-bottom: 2px solid var(--ink2); transform: rotate(45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(-135deg); margin-top: 11px; }
.body { padding: 0 2px 16px 22px; max-width: 68ch; }
.body p { margin: 0 0 10px; text-wrap: pretty; }
.body .why { color: var(--ink2); }
.body .why b { color: var(--ink); font-weight: 600; }
.body .src {
  display: inline-block;
  font-size: 13.5px;
  font-weight: 500;
  padding: 5px 10px;
  border: 1px solid var(--ink);
  border-radius: 4px;
  text-decoration: none;
}
.body .src:hover { background: var(--ink); color: var(--bg); }
.empty { padding: 28px 0; }
.empty p { margin: 0 0 8px; }

@media (prefers-reduced-motion: reduce) {
  .chev, .bar button { transition: none; }
}

/* Reiter */
.tabs { display: flex; gap: 4px; margin: 0 0 20px; border-bottom: 2px solid var(--ink); }
.tabs button {
  flex: 0 1 auto;
  background: none;
  border: 0;
  padding: 8px 18px 6px;
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 20px;
  letter-spacing: .05em;
  text-transform: uppercase;
  color: var(--ink2);
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 480px) { .tabs button { flex: 1 1 0; padding-inline: 6px; font-size: 17px; letter-spacing: .03em; white-space: nowrap; } }

/* Best of YouTube */
.topn { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); counter-reset: rang; }
.topn li { border-bottom: 1px solid var(--line); counter-increment: rang; }
.topn a {
  display: grid;
  grid-template-columns: 2.2ch minmax(0, 1fr);
  gap: 10px;
  padding: 10px 2px;
  text-decoration: none;
}
.topn a::before { content: counter(rang); font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--cc, var(--ink2)); }
.topn a:hover .tt { text-decoration: underline; text-underline-offset: 3px; }
.topn .tt { display: block; font-weight: 600; line-height: 1.35; }
.topn .ts { display: block; margin-top: 2px; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); }
.meth summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  cursor: pointer;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 21px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.meth summary::-webkit-details-marker { display: none; }
.meth summary::after { content: "+"; font-family: var(--f-mono); font-weight: 400; }
.meth[open] summary::after { content: "\2013"; }
.method { margin: 10px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink2); max-width: 60ch; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px 14px; margin-top: 12px; }
.vcard { display: flex; flex-direction: column; gap: 3px; min-width: 0; text-decoration: none; }
.vcard .thumb {
  position: relative;
  display: block;
  aspect-ratio: 16 / 9;
  background: var(--line);
  border-radius: 4px;
  overflow: hidden;
  border-bottom: 3px solid var(--cc, var(--ink));
}
.vcard .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.vcard .dur, .vcard .fmt {
  position: absolute;
  bottom: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-family: var(--f-mono);
  font-size: 11px;
  line-height: 18px;
  background: rgba(0, 0, 0, .78);
  color: #fff;
}
.vcard .dur { right: 6px; }
.vcard .fmt { left: 6px; background: var(--accent); color: var(--accent-ink); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.vcard .vt { margin-top: 4px; font-weight: 600; line-height: 1.35; text-wrap: pretty; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.vcard:hover .vt { text-decoration: underline; text-underline-offset: 3px; }
.vcard .vk { font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vcard .vs { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink2); line-height: 1.5; }
.vcard .vs b { color: var(--ink); font-weight: 500; }
.ynote { margin: 14px 0 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; background: var(--surface); }
</style>

nikonrumors.com/2026/10/12/more-leaked-pictures-of-the-upcoming-nikon-nikkor-z-120-300mm-f-2-8-tc-vr-s-lens.aspx/","datum":"2026-10-12"},{"id":"sony-26mp-stacked","kat":"kamera","typ":"geruecht","sicherheit":1,"titel":"Sony: 26-MP-Stacked-Sensor für FX30 II und A6900?","kurz":"Sony Alpha Rumors fragt, ob ein neuer 26-Megapixel-Sensor in voll gestapelter Bauweise in einer FX30 II und einer A6900 steckt. Belastbare Details fehlen, die Meldung ist ein Fragezeichen.","warum":"Gestapelte Sensoren bedeuten meist weniger Rolling Shutter, wichtig für Video.","quelle":"Sony Alpha Rumors","url":"https://www.sonyalpharumors.com/sonys-new-26mp-fully-stacked-sensor-coming-to-the-fx30-ii-and-a6900/","datum":null,"datum_hinweis":"Quelle ohne Datum"},{"id":"gopro-mission-1-firmware","kat":"kamera","typ":"update","schlagzeile":true,"titel":"GoPro MISSION 1 Pro: 50-MP-RAW-Serien und Anamorphot-Support","kurz":"Beide Modelle bekommen einen schnelleren Auslöser und Serienbilder, mehr als 20 RAW-Fotos mit 50 MP am Stück. Die ILS-Variante unterstützt Anamorphote mit Squeeze 1,33x bis 2,0x, HyperSmooth bleibt aktiv. Die MISSION-Monitor-App zeigt jetzt Histogramm, Waveform, RGB-Parade und False Color.","warum":"Die Dateien tragen Pixel-Aspect-Metadaten, sodass Premiere und Resolve das Bild richtig anzeigen. Die entzerrte Vorschau am Display soll später folgen.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/10/13/gopro-mission-1-pro-mission-1-pro-ils-firmware-updates-continus-50mp-raw-photos-anamorphic-lens-support/","datum":"2026-10-13"},{"id":"lumix-s9-fw-2-1","kat":"kamera","typ":"update","titel":"Lumix S9: Firmware 2.1 mit 4K60 im MP4-Format (Lite)","kurz":"Die Firmware ergänzt 4K60 im MP4-(Lite)-Format, mehr Belegungsoptionen für die Objektivtaste und Unterstützung für LUMIX Flow.","warum":"Relevant für schnelle Clips mit kleineren Dateien.","quelle":"CineD","url":"https://www.cined.com/panasonic-lumix-s9-firmware-2-1-now-available-4k60-in-mp4-lite-more-lens-fn-options-and-lumix-flow-support/","datum":"2026-10-12"},{"id":"nikon-z6iii-fw-2-01","kat":"kamera","typ":"update","titel":"Nikon Z6III: Firmware 2.01 erschienen","kurz":"Nikon hat die Firmware 2.01 für die Z6III veröffentlicht. Die Änderungen stehen im verlinkten Beitrag.","warum":"Die Versionsnummer deutet auf ein Wartungsupdate hin. Vor dem nächsten Dreh einspielen und Changelog prüfen.","quelle":"Nikon Rumors","url":"https://nikonrumors.com/2026/10/14/nikon-z6iii-firmware-update-version-2-01-released.aspx/","datum":"2026-10-14"},{"id":"tamron-16-50-z","kat":"kamera","typ":"news","titel":"Tamron 16-50 mm f/2.8 für Nikon Z (APS-C) offiziell","kurz":"Tamron hat das zuvor durchgesickerte 16-50-mm-f/2.8 für APS-C-Kameras mit Nikon-Z-Mount vorgestellt. Vorbestellungen sollen bald starten.","warum":"Lichtstarkes Standardzoom für Videografen mit Nikon-Z-APS-C-Kameras.","quelle":"Nikon Rumors","url":"https://nikonrumors.com/2026/10/14/tamron-announced-a-new-16-50mm-f-2-8-aps-c-lens-for-nikon-z-mount.aspx/","datum":"2026-10-14"},{"id":"ttartisan-af-24","kat":"kamera","typ":"news","titel":"TTArtisan AF 24 mm F3.8: Vollformat-Autofokus unter 100 Dollar","kurz":"TTArtisan bringt ein Vollformat-Weitwinkel mit Autofokus für Sony E für weniger als 100 US-Dollar.","warum":"Günstiges Zweitobjektiv. Bildqualität und Fokusverhalten sind noch ungetestet.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/10/13/ttartisan-af-24mm-f3-8-a-full-frame-sony-e-mount-af-lens-for-less-than-100-usd/","datum":"2026-10-13"},{"id":"osmo-pocket-4p-venedig","kat":"kamera","typ":"news","titel":"Osmo Pocket 4P: Was DJI mit der Pocket-Kamera vorhat","kurz":"CineD ordnet den Auftritt der Osmo Pocket 4P beim Filmfestival Venedig ein und fragt, welche Strategie DJI damit verfolgt. Ein Labortest der Kamera liegt seit dem 30. Juli vor.","warum":"Interessant, wenn du Pocket-Kameras als zweite Kamera am Set einplanst.","quelle":"CineD","url":"https://www.cined.com/a-pocket-camera-at-the-venice-film-festival-what-dji-wants-with-the-osmo-pocket-4p/","datum":"2026-10-12"},{"id":"sony-fx5-labortest","kat":"kamera","typ":"news","hintergrund":true,"titel":"Sony FX5: Labortest zu Rolling Shutter und Dynamikumfang","kurz":"CineD hat die FX5 im Labor gemessen (Rolling Shutter, Dynamikumfang, Belichtungsspielraum) und nennt sie in der Podcast-Folge einen neuen Maßstab bei Vollformat. Die Folge diskutiert auch Verkaufszahlen von DJI und Insta360 im Vergleich zu Spiegellosen.","warum":"Messwerte statt Datenblatt, wenn du eine Cine-Kamera anschaffst.","quelle":"CineD","url":"https://www.cined.com/sony-fx5-lab-test-rolling-shutter-dynamic-range-and-exposure-latitude/","datum":"2026-09-28"},{"id":"dji-neo-3-leaks","kat":"drohnen","typ":"geruecht","sicherheit":2,"schlagzeile":true,"titel":"DJI Neo 3: Leak-Stand nach gut drei Wochen","kurz":"Seit rund 23 Tagen sickern Details zur Neo 3 durch, zuletzt ein Unboxing-Video. Die Eckdaten gelten laut DroneXL als weitgehend geklärt, Preis und Starttermin fehlen noch.","warum":"Die Neo ist DJIs kleine Drohne für Selfie- und Vlog-Aufnahmen. Ein Nachfolger zeigt, wohin sich Kompaktdrohnen entwickeln.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/08/dji-neo-3-everything-we-know-leaks-roundup/","datum":"2026-10-08"},{"id":"dji-dock-4-teaser","kat":"drohnen","typ":"geruecht","sicherheit":2,"titel":"DJI Dock 4 mit Akkuwechsel: Teaser für heute","kurz":"DJI hat für den 14. Oktober einen Enterprise-Teaser gesetzt. Er zeigt offenbar eine Dock 4, die Akkus automatisch tauscht. Laut Bericht kommt das Produkt nicht in die USA.","warum":"Zeigt den Trend zu autonomen Drohnenstationen im Enterprise-Bereich. Für Filmer eher ein Randthema.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/08/dji-enterprise-teaser-battery-swap-dock-october-14/","datum":"2026-10-08"},{"id":"fcc-pruflabore","kat":"drohnen","typ":"news","schlagzeile":true,"titel":"FCC stimmt am 29. Oktober über chinesische Prüflabore ab","kurz":"Die FCC will darüber abstimmen, Prüflabore auf dem chinesischen Festland ab Dezember 2028 nicht mehr anzuerkennen. Laut Bericht testen diese Labore 82 Prozent der US-Geräte, auch die Osmo Pocket 4P wurde in einem geprüft.","warum":"Betrifft in erster Linie die Zulassung neuer Geräte in den USA.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/10/fcc-vote-chinese-test-labs-82-percent-us-devices/","datum":"2026-10-10"},{"id":"phantom-4-pro-v2-ende","kat":"drohnen","typ":"news","titel":"DJI beendet Reparaturen der Phantom 4 Pro V2","kurz":"Ab dem 31. Oktober repariert DJI die Phantom 4 Pro V2 nicht mehr und rät zum Neukauf. Der Service für die Agras T16 und T20 endet am 2. November.","warum":"Wer eine Phantom 4 Pro V2 fliegt, sollte Reparaturen und Ersatzteile vorher klären.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/12/dji-phantom-4-pro-v2-end-of-service-october-31/","datum":"2026-10-12"},{"id":"mini-5-pro-preis","kat":"drohnen","typ":"news","titel":"DJI Mini 5 Pro: Tiefstpreis von 679 US-Dollar","kurz":"Bei Amazon USA kostet die Mini 5 Pro nach den Prime Big Deal Days weiterhin 679 Dollar, ihr bisher niedrigster Preis.","warum":"US-Preis. In Europa können Angebote abweichen.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/12/dji-mini-5-pro-679-amazon-record-low/","datum":"2026-10-12"},{"id":"avata-360-ohne-acro","kat":"drohnen","typ":"news","hintergrund":true,"titel":"Avata 360 ohne Acro: reicht das?","kurz":"Ein FPV-Pilot testete die Avata 360 in fünf Einsatzszenarien und kommt zu dem Schluss, dass sie für die meisten Käufer mehrere Drohnen ersetzen kann, auch ohne Acro-Modus.","warum":"Einordnung für alle, die zwischen 360°-Kameradrohne und klassischer FPV-Drohne schwanken.","quelle":"DroneXL","url":"https://dronexl.co/2026/09/30/dji-avata-360-kai-vertigoh-fpv-test/","datum":"2026-09-30"},{"id":"gyroflow-1-6-3","kat":"drohnen","typ":"update","hintergrund":true,"titel":"Gyroflow 1.6.3: Bugfixes, davor 1.6.2 mit ProRes RAW","kurz":"Die aktuelle Version 1.6.3 (4. September) behebt 10-Bit-Rendering auf NVIDIA-Karten, einen Absturz auf Intel und Probleme in der Render-Warteschlange. Version 1.6.2 (19. August) brachte ProRes RAW, Insta360 Go Ultra, FFmpeg 8.0 und neue BRAW- und R3D-SDKs.","warum":"Keine neue Version in dieser Woche. Stand zum Nachschlagen.","quelle":"GitHub","url":"https://github.com/gyroflow/gyroflow/releases","datum":"2026-09-04"},{"id":"resolve-21-stand","kat":"schnitt","typ":"update","hintergrund":true,"titel":"DaVinci Resolve 21: Stand der Dinge","kurz":"Resolve 21 (April) brachte eine Photo-Page und KI-Werkzeuge wie IntelliSearch und CineFocus. Zuletzt erschien Version 21.0.2 am 1. Juli mit schnellerem Bypass-Wechsel und besserer H.265-Wiedergabe auf NVIDIA-GPUs. Für Tests mit KI-Assistenten wird bereits Version 21.1 Studio genutzt.","warum":"Keine neue Resolve-Meldung in dieser Woche.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/07/01/davinci-resolve-21-0-2-update/","datum":"2026-07-01"},{"id":"adobe-max-2026","kat":"schnitt","typ":"news","titel":"Adobe MAX: 10. bis 12. November in Miami Beach","kurz":"Mehr als 200 Sessions in sieben Tracks, darunter „Accelerating Creativity with AI“ sowie Video, Audio und Motion. Die Vorkonferenz läuft am 8. und 9. November, eine Online-Teilnahme ist möglich.","warum":"Adobe stellt dort üblicherweise neue Firefly- und Premiere-Funktionen vor.","quelle":"Adobe MAX","url":"https://max.adobe.com/","datum":null,"datum_hinweis":"Termin"},{"id":"premiere-paper-edit","kat":"schnitt","typ":"news","titel":"Premiere: Highlights per Paper Edit im Transkript-Panel","kurz":"Der Dienstagstipp von Jeff Greenberg zeigt, wie sich im Transkript-Panel die stärksten Momente per Paper Edit herausziehen lassen. Der Tipp davor verhindert, dass Premiere beim Schneiden automatisch Spuren anlegt.","warum":"Zwei kleine Workflow-Gewinne ohne neue Software.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/tool-tip-tuesday-for-adobe-premiere-grab-the-best-moments-in-the-transcript-panel-with-paper-edit/","datum":"2026-10-13"},{"id":"nle-ki-assistenten-test","kat":"ki","typ":"news","schlagzeile":true,"hintergrund":true,"titel":"Test: KI-Assistenten in Premiere und Resolve","kurz":"ProVideo Coalition ließ den Premiere-Assistenten (Beta) und Resolve 21.1 Studio mit Claude 19 Interviewclips auf eigene Timelines verteilen und Stringouts bauen. Beide schafften die Grundaufgaben, brauchten aber Nachbesserung. Resolve war bei Wiederholungsarbeit schneller, Premiere lieferte genauere Rückmeldungen. Bei Farbe, Audio-Keyframes und Grafikskalierung versagten beide teilweise. Premiere nutzt kostenlose tägliche Firefly-Credits, die Adobe nicht garantiert.","warum":"Der wichtigste Realitätscheck für alle, die den Schnitt per KI vereinfachen wollen: Der Zeitgewinn ist offen, ein schneller Cutter ist von Hand oft flotter.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/battle-of-the-nle-ai-assistants/","datum":null,"datum_hinweis":"vor ca. 4 Wochen"},{"id":"rohschnitt-tools-mcp","kat":"ki","typ":"news","titel":"Rohschnitt-Tools und MCP-Brücken für Editoren","kurz":"Iain Andersons Roundup nennt Doza Assist, PowerCut, RoughCut und Cutler (Beta) für automatische Rohschnitte sowie Jumper, das eigene KI-Werkzeuge per MCP an den Schnittplatz anbindet. FCP Extender bringt Generative Extend für Final Cut, abgerechnet über Credits.","warum":"Viele dieser Tools entstehen mit KI-Coding. Sie sind klein, schnell und oft günstiger als große Suiten.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/roundup-new-software-for-video-editors/","datum":"2026-10-05"},{"id":"compositor-opencine","kat":"foto","typ":"news","titel":"Compositor: freie Open-Source-Alternative zu Photoshop","kurz":"Robbie Tilton baut Compositor als kostenlose, quelloffene Photoshop-Alternative. Ein gewünschtes Feature (Filter Layers) kam laut Roundup binnen eines Tages dazu. Ebenfalls dabei: OpenPocketCine, eine freie Begleit-App für DJI-Osmo-Kameras mit Monitor, Scopes und Kamerasteuerung, sowie Softbox zur Hautglättung.","warum":"Foto-Compositing und Osmo-Monitoring ohne Abo.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/roundup-new-software-for-video-editors/","datum":"2026-10-05"},{"id":"getty-glaeubigerschutz","kat":"foto","typ":"news","titel":"Getty Images beantragt Gläubigerschutz","kurz":"Getty will laut CineD Schulden abbauen und in private Hand übergehen. Für Contributor soll sich nichts ändern.","warum":"Wichtig für Stockfoto-Lizenzierung und die Einnahmen von Fotografen.","quelle":"CineD","url":"https://www.cined.com/getty-images-to-file-for-bankruptcy-protection-debt-cut-private-ownership-no-change-for-contributors/","datum":"2026-10-13"},{"id":"macos-27-update","kat":"schnitt","typ":"news","titel":"macOS 27 „Golden Gate“: schon updaten?","kurz":"CineD prüft, ob Videoeditoren das Update auf macOS 27 schon wagen können.","warum":"Bis zur Klärung Resolve, Premiere und Plugins gegen die Kompatibilitätslisten der Hersteller prüfen.","quelle":"CineD","url":"https://www.cined.com/macos-27-golden-gate-for-video-editors-is-it-safe-to-update-yet/","datum":"2026-10-12"}],"key":"2026-KW42"},{"jahr":2026,"kw":43,"von":"2026-10-14","bis":"2026-10-19","stand":"2026-10-19","intro":"Vor der NAB Show New York (21.–22. Oktober) kommen die IP-Themen in Fahrt: ein ST-2110-Neubau an einer US-Universität, eine Cloud-Plattform auf Basis des offenen TAMS-Standards und eine IP-Intercom ohne Zentralmatrix. Bei Drohnen startet DJI die erste Dockingstation mit automatischem Akkuwechsel, bei der KI geht es um automatisierte Clips für Newsrooms und um schnelleres Rendering in Adobe-Programmen.","hinweis":"Kleinere Ausgabe: Der Berichtszeitraum ist mit sechs Tagen kurz, und mehrere Quellen (u. a. Nikon Rumors, Sony Alpha Rumors, Canon Rumors, GitHub) waren im automatischen Lauf nicht abrufbar. Meldungen, bei denen nur Überschrift oder Anreißer gelesen wurden, sind entsprechend knapp gehalten. Korrektur zur Vorwoche: Die NAB Show New York findet am 21. und 22. Oktober statt, nicht am 20. und 21. Oktober. Zu jeder Meldung gibt die Zeile „Relevanz“ eine kurze Einschätzung für eine Broadcast-Firma mit Schwerpunkt Automatisierung und IP-Technik.","termine":[{"datum":"2026-10-20","text":"DJI Osmo Pocket 4P in Pearl White, Teaser-Launch 12 Uhr GMT (nicht in den USA)"},{"datum":"2026-10-21","label":"21.–22.10.","text":"NAB Show New York, Javits Center (u. a. ENCO, Pliant, MultiDyne, Cerberus Tech/Matrox, Imagine Communications)"},{"datum":"2026-10-24","text":"Sigma Produktevent, mögliches Objektiv: 65 mm f/1.1 oder f/1.0","geruecht":true},{"datum":"2026-10-29","text":"FCC-Abstimmung über chinesische Prüflabore"},{"datum":"2026-10-30","label":"Ende Okt.","text":"Nikkor Z 120-300 mm f/2.8 TC VR S erwartet","geruecht":true},{"datum":"2026-10-31","text":"DJI beendet Reparaturen der Phantom 4 Pro V2"},{"datum":"2026-11-01","label":"Nov.","text":"Nikon Z70 erwartet","geruecht":true},{"datum":"2026-11-10","label":"10.–12.11.","text":"Adobe MAX, Miami Beach (auch online)"}],"items":[{"id":"huskervision-st2110","kat":"broadcast","typ":"news","schlagzeile":true,"titel":"HuskerVision baut ST-2110-Produktion für alle Sportstätten der Uni Nebraska","kurz":"Die Videoabteilung der University of Nebraska Athletics ersetzt ihre alte Baseband-Infrastruktur durch eine IP-Umgebung nach SMPTE ST 2110. Integriert wurde das Projekt in rund sechs Monaten von BeckTV mit Grass Valley: zwei Kayenne-K-Frame-Switcher, LDX-Kameras, drei neue Regieräume und 100-GbE-Anbindung. Das Netz trägt HD bis 12G-UHD mit HDR, und Systeme von Grass Valley und Drittanbietern teilen sich dasselbe Netzwerk statt fester Baseband-Verbindungen.","warum":"Relevanz hoch: Ein Praxisbeispiel für den vollständigen Umstieg von SDI auf ST 2110, konkret übertragbar auf den Umbau einer Regie oder eines OB-Trucks, bei dem Kamera, Switcher und Farbkorrektur flexibel über das Netz gesteuert werden.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/sports-production/huskervision-deploys-grass-valley-based-st-2110-production-facility","datum":"2026-10-14"},{"id":"bmg-media-command","kat":"broadcast","typ":"news","schlagzeile":true,"titel":"BMG Media Command: Private Cloud für Aufnahme, MAM, Playout und Archiv","kurz":"Broadcast Management Group bündelt Aufnahme, Medienverwaltung, Playout, Archiv und Compliance in einer Plattform, die BMG als Managed Service aus der eigenen Leitstelle betreibt. Technisch basiert sie auf dem offenen TAMS-Standard (Time Addressable Media Store, ursprünglich BBC R&D), bei dem Medien als kurze Segmente referenziert statt kopiert werden. Eingespeist wird über ST 2110, SRT, RTMP, JPEG XS und SDI; Plug-ins für Premiere und DaVinci Resolve erlauben das Schneiden, während noch aufgenommen wird.","warum":"Relevanz hoch: Zeigt, wie sich Ingest, Schnitt und Playout über offene APIs automatisieren lassen; ein konkretes Anwendungsgebiet wären Near-Live-Highlights aus einem laufenden Event, die der Editor direkt aus dem Aufnahmestrom zieht.","quelle":"TV Technology","url":"https://www.tvtechnology.com/infrastructure/cloud/bmg-unveils-media-command","datum":"2026-10-15"},{"id":"tndv-remi-boxing","kat":"broadcast","typ":"news","titel":"REMI im Praxiseinsatz: Team Boxing League produziert aus einem Truck in Texas","kurz":"TNDV und GameTime Productions haben die vierte Saison der Team Boxing League vollständig fernproduziert: Regie, Programmausgabe und Distribution liefen aus einem Truck in Irving, Texas, während lokale Crews an wechselnden Austragungsorten sechs Kameras bedienten. Die Signale kamen per SRT über das öffentliche Internet mit rund 10 Mbit/s pro Kamera, als Rückfall diente Mobilfunk-Bonding von LiveU. Für die Kommunikation kam Unity Intercom zum Einsatz.","warum":"Relevanz hoch: Ein belastbares Muster für Remote-Produktion mit kleinem Vor-Ort-Team, übertragbar auf Sport oder Events in Hallen, in die kein Übertragungswagen passt.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/sports-production/tndv-gametime-productions-expand-remis-role-with-team-boxing-league","datum":"2026-10-15"},{"id":"cerberus-livelink-studio","kat":"broadcast","typ":"news","titel":"Cerberus Tech zeigt Livelink Studio: Live-Produktion in der Cloud nach Bedarf","kurz":"Livelink Studio ist eine Produktions- und Master-Control-Umgebung in der Cloud, aufgebaut auf dem Matrox-ORIGIN-Framework. Sie lässt sich für ein Event starten, danach abschalten und später wieder hochfahren (Pay-as-you-go). Enthalten sind Switching, Audio-Mix, Grafik mit Lower Thirds und Tickern, Multiviewer, Aufnahme und Routing; NDI-Eingänge und SRT-Telemetrie werden unterstützt. Die Premiere läuft auf der NAB Show New York am Matrox-Stand 827.","warum":"Relevanz mittel bis hoch: Ein naheliegendes Einsatzgebiet ist Overflow- oder Notfall-Playout, bei dem ein zusätzlicher Produktionskanal nur für die Dauer eines Events hochgefahren wird.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/cerberus-tech-to-introduce-livelink-studio-at-2026-nab-show-new-york","datum":"2026-10-14"},{"id":"pliant-crewcom-flex","kat":"broadcast","typ":"news","titel":"Pliant CrewCom Flex: Intercom ohne zentrale Matrix auf ST-2110-Basis","kurz":"Pliant zeigt auf der NAB Show New York ein „frameless“ Intercom-System, bei dem jedes Bedienpanel seine eigene verteilte Matrix mitbringt und so keinen zentralen Hardware-Frame braucht. Es kombiniert drahtgebundene, drahtlose und virtuelle Kommunikation auf einem AES67- und ST-2110-Backbone und unterstützt ST 2022-7 für Redundanz. Dazu gehören ein browserbasiertes virtuelles Panel und ein Dante/AES67-Interface für bestehende CrewCom-Funkanlagen.","warum":"Relevanz hoch: Passt zu IP-Regien, weil Sprechverbindungen im selben Netz wie Video und Audio laufen; ein Anwendungsfall ist die Intercom-Anbindung von Remote-Mitarbeitenden über das virtuelle Panel.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/pliant-to-feature-crewcom-flex-at-2026-nab-show-new-york","datum":"2026-10-14"},{"id":"multidyne-silverback-kits","kat":"broadcast","typ":"news","titel":"MultiDyne bietet SilverBack-Faserkits für Sony VENICE, BURANO und Canon C400","kurz":"Die Kits bündeln das SilverBack-Fasersystem, die kompakte 1-HE-Basisstation SVB-1 sowie kameraspezifische Kabel und Halterungen. Sie sind für Sony VENICE, Sony BURANO und Canon EOS C400 gedacht und tragen Video, Audio, Steuerung und Rückkanäle über eine einzige Glasfaser. MultiDyne zeigt sie auf der NAB Show New York am Stand 856.","warum":"Relevanz mittel: Interessant für Live-Cinema-Produktionen mit Cine-Kameras, bei denen Kamerakontrolle und Rückbild über Faser statt mehrerer Kabel laufen sollen.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/multidyne-introduces-complete-silverback-fiber-camera-kits-for-live-cinema-production","datum":"2026-10-15"},{"id":"imagine-nab-ny-insight","kat":"broadcast","typ":"news","titel":"NAB New York: Imagine Communications im Exhibitor-Insight-Format","kurz":"TV Technology hat Imagine Communications in der Reihe „Exhibitor Insight“ zur NAB Show New York vorgestellt. Gelesen wurde nur die Überschrift, der Inhalt ist hier nicht wiedergegeben.","warum":"Relevanz offen: Imagine ist laut einer Meldung vom April seit zehn Jahren im ST-2110-Umfeld aktiv, was genau gezeigt wird, steht erst nach Lektüre des Beitrags fest.","quelle":"TV Technology","url":"https://www.tvtechnology.com/events/2026-nab-show-new-york-exhibitor-insight-imagine-communications","datum":"2026-10-16"},{"id":"wooden-camera-fx6","kat":"kamera","typ":"news","titel":"Wooden Camera veröffentlicht überarbeitetes Zubehörsystem für die Sony FX6","kurz":"Laut Überschrift bei TV Technology bringt Wooden Camera ein neu gestaltetes Zubehörsystem für die Sony FX6. Weitere Details wurden nicht gelesen.","warum":"Relevanz gering: Reines Rigging-Zubehör, nur interessant, wenn FX6-Kameras im Haus im Einsatz sind.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/live-production/wooden-camera-releases-redesigned-sony-fx6-accessory-system","datum":"2026-10-14"},{"id":"sony-ecm-w5","kat":"kamera","typ":"news","titel":"Sony ECM-W5: Funkmikrofon-System mit 32-Bit-Float-Aufnahme","kurz":"Sony hat das Funkmikrofon-System ECM-W5 angekündigt. Laut CineD-Überschrift wird es über den Multi-Interface-Schuh der Kamera angeschlossen und nimmt in 32-Bit-Float auf, zusätzlich gibt es eine 64-GB-Backup-Aufnahme und Timecode. Preis und Verfügbarkeit wurden nicht gelesen.","warum":"Relevanz mittel: Timecode und interne Backup-Aufnahme machen das System für Ein-Personen-Drehs und Interviews interessant, bei denen Ton später automatisch an das Bild synchronisiert werden soll.","quelle":"CineD","url":"https://www.cined.com/sony-ecm-w5-wireless-microphone-system-announced-32-bit-float-via-mi-shoe-64gb-backup-recording-timecode/","datum":"2026-10-15","datum_hinweis":"Ankündigung laut Photo-Rumors-Liste am 15.10.; CineD zeigt nur „vor 3 Tagen“."},{"id":"z-cam-e2-f6-fw","kat":"kamera","typ":"update","titel":"Z CAM E2-F6 Pro: Firmware 0.9.10 bringt interne ProRes RAW-Aufnahme","kurz":"Laut Überschrift erlaubt die Firmware 0.9.10 für die Z CAM E2-F6 Pro interne ProRes-RAW-Aufnahme bis 6K bei 60 Bildern pro Sekunde. Mehr als die Überschrift wurde nicht gelesen.","warum":"Relevanz gering bis mittel: Für Produktionen mit Z-CAM-Kameras ein sinnvoller Workflow-Gewinn, ein breiter Broadcast-Einsatz ist eher unwahrscheinlich.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/10/16/z-cam-e2-f6-pro-firmware-update-adds-prores-raw-internally-at-up-to-6k-60fps/","datum":"2026-10-16"},{"id":"osmo-pocket-4p-pearl-white","kat":"kamera","typ":"news","titel":"DJI Osmo Pocket 4P in Pearl White: Launch am 20. Oktober, ohne USA","kurz":"DJI kündigt für den 20. Oktober um 12 Uhr GMT die weiße Variante der Osmo Pocket 4P an. In China ist sie seit dem 16. September erhältlich, die schwarze 4P kam am 30. Juli weltweit ohne die USA auf den Markt. Einen Preis nennt der Teaser nicht.","warum":"Relevanz gering: Nur eine neue Farbe, kein technisches Update; höchstens als Fall für kleine B-Kameras oder Social-Clips interessant.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/15/dji-osmo-pocket-4p-pearl-white-october-20-launch/","datum":"2026-10-15"},{"id":"sigma-yamaki-interview","kat":"kamera","typ":"news","titel":"Sigma-Chef Yamaki im IBC-Interview: 85 mm f/1.2 Art, 20-60 mm f/2.8-4 und Aizu-Festbrennweiten","kurz":"Laut Anreißer bei Sony Addict spricht Sigma-CEO Kazuto Yamaki über das neue 85 mm f/1.2 Art, das 20-60 mm f/2.8-4 Contemporary, die Aizu-Festbrennweiten, Filter sowie KI und Robotik. Der Interviewtext selbst wurde nicht gelesen.","warum":"Relevanz gering bis mittel: Interessant wegen der Hinweise auf Sigmas Richtung (Optik plus KI), konkrete Produktdaten fehlen noch.","quelle":"Sony Addict","url":"https://sonyaddict.com/2026/10/18/ibc-2026-sigma-ceo-kazuto-yamaki-on-the-new-85mm-f-1-2-art-20-60mm-f-2-8-4-contemporary-aizu-primes-filters-ai-and-robotics/","datum":"2026-10-18"},{"id":"canon-patent-high-index","kat":"kamera","typ":"geruecht","sicherheit":1,"titel":"Canon-Patent: Hochbrechendes Glas könnte RF 100 mm f/1.4 und RF-S 65 mm f/1.4 verkleinern","kurz":"Ein Canon-Patent (JP 2026-167867) beschreibt Hochindex-Glas, mit dem sich die Festbrennweiten RF 100 mm f/1.4 und RF-S 65 mm f/1.4 kleiner bauen ließen. Ein Patent sagt nichts darüber, ob und wann daraus Produkte entstehen.","warum":"Relevanz gering: Reine Spekulation ohne Produktbezug, für den Broadcast-Alltag derzeit ohne Folgen.","quelle":"Canon Addict","url":"https://canonaddict.com/2026/10/17/canon-patent-jp-2026-167867-revolutionary-high-index-glass-aims-to-shrink-rf-100mm-f-1-4-rf-s-65mm-f-1-4-aps-c-primes/","datum":"2026-10-17"},{"id":"dji-dock-4-matrice-5td","kat":"drohnen","typ":"news","schlagzeile":true,"titel":"DJI Dock 4 und Matrice 5TD: erste Dockingstation mit automatischem Akkuwechsel","kurz":"DJI hat am 14. Oktober die Dock 4 samt Matrice 5TD vorgestellt. Der Akkuwechsel dauert laut DJI 25 Sekunden, von der Landung bis zum nächsten Start vergehen 45 Sekunden. Die Station hält drei Ersatzakkus und lädt bis zu zwei gleichzeitig. Die Drohne fliegt bis zu 59 Minuten und trägt drei 50-Megapixel-Kameras, eine Wärmebildkamera, Lidar und Millimeterwellenradar. In den USA ist sie wegen der Covered List nicht verkäuflich.","warum":"Relevanz mittel: Vollautomatische Drohnen-in-der-Box-Systeme passen zum Automatisierungsgedanken, ein Anwendungsgebiet wären wiederkehrende Luftaufnahmen oder Inspektionen von Sendeanlagen und Gelände ohne Pilot vor Ort.","quelle":"DroneXL","url":"https://dronexl.co/2026/10/16/fcc-chinese-test-labs-dronesense-laanc-dji-dock-4-matrice-5td/","datum":"2026-10-16"},{"id":"adobe-nvidia-partnerschaft","kat":"schnitt","typ":"news","schlagzeile":true,"titel":"Adobe und NVIDIA vertiefen KI-Partnerschaft: Premiere und Frame.io schneller","kurz":"Adobe optimiert Photoshop, Premiere und Substance 3D für NVIDIAs neuen RTX-Spark-Chip und nennt bis zu doppelt so schnelle KI-Verarbeitung, Bearbeitung, Farbe und Effekte. In Premiere sollen unter anderem Wiedergabe, Rendering, Sprachverbesserung und Objektmaske profitieren. In Frame.io übernehmen NVIDIA-GPUs Decoding und Suchvorbereitung; erste Tests zeigen etwa fünffach schnelleres Erzeugen von Embeddings. Vorgeführt werden soll das auf der Adobe MAX im November.","warum":"Relevanz mittel: Schnellere GPU-Verarbeitung verkürzt Nachbearbeitung, und die Frame.io-Suche per Embeddings ist ein Ansatz für automatisches Auffinden von Szenen in großen Medienarchiven.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/adobe-nvidia-expand-their-ai-partnership","datum":"2026-10-15"},{"id":"resolve-21-1-mcp","kat":"schnitt","typ":"update","hintergrund":true,"titel":"DaVinci Resolve 21.1: MCP-Server und KI-Assistenten-Anbindung","kurz":"Keine neue Version in dieser Woche, aber ein Blick auf 21.1 vom 7. September lohnt für die Automatisierung: Das Update bringt eine KI-Assistenten-Integration, einen nativen MCP-Server und eine Python-Konsole. Neue API-Aufrufe richten Clips auf der Timeline automatisch aus, normalisieren Audio und liefern Transkriptionen mit Sprecher und Timing. Erweiterte Skripte erfordern die Studio-Version.","warum":"Relevanz hoch: Der MCP-Server und die Python-API erlauben automatisierte Schnittschritte, etwa einen Batch, der Interviews synchronisiert, den Pegel normalisiert und ein Transkript für den Rohschnitt erzeugt.","quelle":"Newsshooter","url":"https://www.newsshooter.com/2026/09/07/blackmagic-design-davinci-resolve-21-1/","datum":"2026-09-07"},{"id":"enco-encue-spotai","kat":"ki","typ":"news","schlagzeile":true,"titel":"ENCO bringt enCue und SPOTai für Newsrooms nach Nordamerika","kurz":"enCue ist ein browserbasiertes Cloud-Tool, das in langen Sendungen Schlüsselmomente findet und daraus Social-Clips mit Titeln, Untertiteln und Hochformat-Umsetzung sowie 15-Sekunden-Teaser erzeugt. Es kann auch Skript oder Sprechertext mit Rohmaterial abgleichen und fertige Beiträge für den Editor vorbereiten. SPOTai erzeugt aus Markeninfos und Text-Prompt Werbespots in 1080p. Beide debütieren auf der NAB Show New York an Stand 539.","warum":"Relevanz hoch: Automatisches Clip-Farming aus Livesendungen ist ein direkter Hebel für Newsrooms, ein Anwendungsgebiet wäre die Social-Aufbereitung einer Live-Sendung noch während der Ausstrahlung.","quelle":"TV Technology","url":"https://www.tvtechnology.com/production/enco-highlights-ai-tools-for-newsrooms-local-ads-at-nab-show-new-york","datum":"2026-10-15"},{"id":"elevenlabs-hoerbuch","kat":"ki","typ":"news","titel":"Mehrstimmige Hörbücher: menschliche Sprecher oder geklonte ElevenLabs-Stimmen","kurz":"ProVideo Coalition widmet sich Hörbüchern mit mehreren Stimmen für Dialoge, entweder mit menschlichen Schauspielern oder mit per ElevenLabs geklonten Stimmen. Gelesen wurde nur die Überschrift, Ergebnisse oder Bewertung sind daher nicht wiedergegeben.","warum":"Relevanz gering bis mittel: Synthetische Stimmen sind ein denkbarer Baustein für automatisierte Ansagen oder Mehrsprachigkeit, rechtliche und redaktionelle Fragen bleiben offen.","quelle":"ProVideo Coalition","url":"https://www.provideocoalition.com/audiobooks-with-multiple-voices-for-dialog-using-human-actors-or-cloned-with-elevenlabs/","datum":"2026-10-14"},{"id":"instax-square-2","kat":"foto","typ":"news","titel":"Fujifilm kündigt Instax SQUARE 2 und den Film „Soft Haze“ an","kurz":"Fujifilm hat laut Photo-Rumors-Liste eine neue Sofortbildkamera Instax SQUARE 2 zusammen mit einer Filmvariante „Soft Haze“ vorgestellt. Weitere Details wurden nicht gelesen.","warum":"Relevanz gering: Consumer-Produkt ohne Bezug zu Broadcast oder Automatisierung.","quelle":"Fuji Addict","url":"https://fujiaddict.com/2026/10/14/instax-square-2-and-soft-haze-film-announced/","datum":"2026-10-14"},{"id":"gfx100rf-interview","kat":"foto","typ":"news","titel":"Fujifilm GFX100RF: Interview zur Entstehung der 100-MP-Mittelformatkamera","kurz":"Laut Anreißer erklärt ein Interview, wie die 100-Megapixel-Mittelformatkamera GFX100RF bei Fujifilm entwickelt wurde. Der Interviewtext selbst wurde nicht gelesen.","warum":"Relevanz gering: Hintergrundlektüre für Fotografie, ohne direkten Nutzen für Broadcast.","quelle":"Fuji Addict","url":"https://fujiaddict.com/2026/10/18/pp-fujifilm-gfx100rf-interview-inside-fujifilm-how-the-100mp-gfx100rf-medium-format-camera-is-made/","datum":"2026-10-18"},{"id":"lightroom-prompt-to-edit","kat":"foto","typ":"update","hintergrund":true,"titel":"Lightroom: „Prompt to Edit“ und Reflexionsentfernung im September-Update","kurz":"Keine neue Version in dieser Woche. Das letzte Lightroom-Desktop-Update führt „Prompt to Edit“ ein, bei dem man die gewünschte Bearbeitung beschreibt, etwa Retusche oder Restaurierung. Es nutzt das Modell Nano Banana. Dazu kommt eine Funktion, die Reflexionen auf Glas, Wasser und Fenstern entfernt, sowie Unterstützung für neue Kameras und Objektive.","warum":"Relevanz gering bis mittel: Sprachgesteuerte Bildbearbeitung ist ein Vorgeschmack auf KI-Bedienung auch im Videobereich, etwa für schnelle Korrekturen an Standbildern und Thumbnails.","quelle":"Adobe Hilfe","url":"https://helpx.adobe.com/lightroom/desktop/introduction/release-notes.html","datum":null,"datum_hinweis":"September-2026-Update, Seite zuletzt am 29.09. aktualisiert."}],"key":"2026-KW43"}];

  function toggleCat(id) {

  function renderHead() {

    }

    var sn = $('startnote');
    if (e.hinweis) { sn.textContent = e.hinweis; sn.hidden = false; } else { sn.hidden = true; }
  }

  function counts() {
    var c = {};
    ed().items.forEach(function (it) { c[it.kat] = (c[it.kat] || 0) + 1; });
    return c;
  }

  function renderBar() {
    var bar = $('bar'), c = counts();
    bar.textContent = '';
    bar.className = 'bar' + (catActive() ? ' filtered' : '');
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var b = h('button', {
        type: 'button',
        'aria-pressed': state.cats[cat.id] ? 'true' : 'false',
        'aria-label': cat.label + ', ' + c[cat.id] + ' Meldungen',
        title: cat.label + ' (' + c[cat.id] + ')'
      });
      b.style.background = catColor(cat.id);
      b.style.flexGrow = String(c[cat.id]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      bar.appendChild(b);
    });
  }

  function renderChips() {
    var box = $('chips'), c = counts();
    box.textContent = '';
    CATS.forEach(function (cat) {
      if (!c[cat.id]) return;
      var dot = h('span', { class: 'dot' });
      dot.style.setProperty('--cc', catColor(cat.id));
      dot.style.marginTop = '0';
      var b = h('button', { type: 'button', class: 'chip', 'aria-pressed': state.cats[cat.id] ? 'true' : 'false' },
        [dot, cat.label, h('span', { class: 'n', text: String(c[cat.id]) })]);
      b.addEventListener('click', function () { toggleCat(cat.id); });
      box.appendChild(b);
    });
  }

  function renderSeg(id, opts, key) {
    var box = $(id);
    box.textContent = '';
    opts.forEach(function (o) {
      var b = h('button', { type: 'button', 'aria-pressed': state[key] === o[0] ? 'true' : 'false', text: o[1] });
      b.addEventListener('click', function () { state[key] = o[0]; renderSeg(id, opts, key); renderList(); });
      box.appendChild(b);
    });
  }

  function renderTop() {
    var e = ed(), ul = $('top');
    ul.textContent = '';
    e.items.filter(function (it) { return it.schlagzeile; }).forEach(function (it) {
      var dot = h('span', { class: 'dot' });
      dot.style.setProperty('--cc', catColor(it.kat));
      var sub = CAT[it.kat].label + (it.typ === 'geruecht' ? ' · Gerücht' : '');
      var b = h('button', { type: 'button' }, [dot, h('span', {}, [h('span', { class: 'tt', text: it.titel }), h('span', { class: 'ts', text: sub })])]);
      b.addEventListener('click', function () { openItem(it.id); });
      ul.appendChild(h('li', {}, [b]));
    });
  }

  function renderTermine() {
    var e = ed(), ol = $('termine');
    ol.textContent = '';
    var list = (e.termine || []).slice().sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : 0; });

      var cls = t.datum < e.stand ? 'past' : (t.datum === e.stand ? 'heute' : '');
      var tx = h('span', { class: 'tx' }, [t.text]);
      if (t.datum === e.stand) tx.appendChild(h('span', { class: 'tag', text: 'heute' }));

  function row(e, it, showCat) {

    if (state.unread) renderList();
  });

  renderAll();
})();
</script>

      img,
      it.format === 'short' ? h('span', { class: 'fmt', text: 'Short' }) : null,
      h('span', { class: 'dur', text: dauer(it.dauer_s) })
    ]);
    var s1 = h('span', { class: 'vs' }, [
      h('b', { text: kompakt(it.aufrufe) }), ' Aufrufe',
      it.likes != null ? ' · ' : null, it.likes != null ? h('b', { text: kompakt(it.likes) }) : null, it.likes != null ? ' Likes' : null
    ]);
    var s2 = h('span', { class: 'vs', text: alter(it.veroeffentlicht) + ' · ' + kompakt(Math.round(it.trend)) + '/Tag' });
    var a = h('a', {
      class: 'vcard', href: url(it), target: '_blank', rel: 'noopener noreferrer',
      'aria-label': it.titel + ' von ' + it.kanal + ' auf YouTube'
    }, [thumb, h('span', { class: 'vt', text: it.titel }), h('span', { class: 'vk', text: it.kanal }), s1, s2]);
    a.style.setProperty('--cc', catColor(it.kat));
    return a;
  }

  function renderList() {
    var items = visible().sort(SORT[state.sort]), box = $('y-list');
    box.textContent = '';
    $('y-count').textContent = items.length + ' von ' + ITEMS.length + ' Einträgen';
    if (!items.length) {
      var reset = h('button', { type: 'button', class: 'linkbtn', text: 'Filter zurücksetzen' });
      reset.addEventListener('click', function () {
        state.cats = {}; state.fmt = 'alle'; state.q = ''; $('y-q').value = '';
        renderBar(); renderChips(); renderSeg('y-fmt', FMT_OPTS, 'fmt'); renderList();
      });
      box.appendChild(h('div', { class: 'empty' }, [h('p', { text: 'Kein Eintrag passt zu diesen Filtern.' }), reset]));
      return;
    }
    if (state.view === 'gesamt') {
      var g = h('div', { class: 'vgrid' });
      items.forEach(function (it) { g.appendChild(card(it)); });
      box.appendChild(g);
      return;
    }
    CATS.forEach(function (cat) {
      var list = items.filter(function (it) { return it.kat === cat.id; });
      if (!list.length) return;
      var head = h('div', { class: 'ghead' }, [h('h3', { text: cat.label }), h('span', { class: 'gn', text: String(list.length) })]);
      var grid = h('div', { class: 'vgrid' });
      list.forEach(function (it) { grid.appendChild(card(it)); });
      var sec = h('section', { class: 'group' }, [head, grid]);
      sec.style.setProperty('--cc', catColor(cat.id));
      box.appendChild(sec);
    });
  }

  $('y-meta').textContent = 'Stand ' + dmy(YT.stand) + ' · letzte ' + YT.tage + ' Tage · ' + ITEMS.length + ' Einträge';
  $('y-method').textContent = YT.methode || '';
  if (YT.hinweis) { $('y-note').textContent = YT.hinweis; $('y-note').hidden = false; }
  $('y-q').addEventListener('input', function (ev) { state.q = ev.target.value; renderList(); });
  renderBar(); renderChips();
  renderSeg('y-fmt', FMT_OPTS, 'fmt');
  renderSeg('y-sort', SORT_OPTS, 'sort');
  renderSeg('y-view', VIEW_OPTS, 'view');
  renderTop(); renderList();

  /* Reiter: #youtube in der Adresse öffnet den Bereich direkt */
  var tabs = $('tabs'), viewNews = $('view-news'), viewYt = $('view-yt');
  var tabBtns = Array.prototype.slice.call(tabs.querySelectorAll('button'));
  function show(view, push) {
    var yt = view === 'youtube';
    viewNews.hidden = yt;
    viewYt.hidden = !yt;
    tabBtns.forEach(function (b) {
      var on = b.getAttribute('data-view') === view;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
    if (push) {
      try { history.replaceState(null, '', yt ? '#youtube' : location.pathname + location.search); } catch (e) {}
    }
  }
  tabBtns.forEach(function (b, i) {
    b.addEventListener('click', function () { show(b.getAttribute('data-view'), true); });
    b.addEventListener('keydown', function (ev) {
      if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
      var n = tabBtns[(i + (ev.key === 'ArrowRight' ? 1 : tabBtns.length - 1)) % tabBtns.length];
      show(n.getAttribute('data-view'), true);
      n.focus();
      ev.preventDefault();
    });
  });
  window.addEventListener('hashchange', function () { show(location.hash === '#youtube' ? 'youtube' : 'news', false); });
  tabs.hidden = false;
  show(location.hash === '#youtube' ? 'youtube' : 'news', false);
})();
</script>

</body>
</html>
