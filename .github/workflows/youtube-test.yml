name: YouTube API Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: YouTube Data API testen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "Secret YOUTUBE_API_KEY ist leer oder nicht gesetzt"
            exit 1
          fi
          code=$(curl -sS -o resp.json -w "%{http_code}" \
            "https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=3&q=Blackmagic%20DaVinci%20Resolve&key=${YOUTUBE_API_KEY}")
          echo "HTTP-Status: $code"
          if [ "$code" != "200" ]; then
            python3 -c "import json;e=json.load(open('resp.json')).get('error',{});print('Fehler:',e.get('code'),e.get('message'));print('Grund:',[x.get('reason') for x in e.get('errors',[])])"
            exit 1
          fi
          python3 -c "import json;d=json.load(open('resp.json'));print('Treffer:',len(d.get('items',[])));[print('-',i['snippet']['title']) for i in d.get('items',[])]"
